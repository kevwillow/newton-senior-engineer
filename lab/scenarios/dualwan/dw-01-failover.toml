name = "dw-01-failover"
description = "DW-01: the WAN-health tool demotes wan when ISP-A (eth1/10.100.0.1) is cut upstream. The scenario proves the change by packet counters on lab-isp (an nft `inet nwcount` table with one named counter per upstream interface, eth2 / eth3). The probe target is 198.51.100.9/32 on lab-isp's lo, reached by either WAN gateway from lab-r1; client pings are 200-byte so the health tool's own 56-byte probes do not match the counter rule. The effect (timeout 150) sources lab/dualwan-lib.sh, traps `nwcut_off` EXIT, confirms the baseline (traffic leaves via ISP-A), makes an `inet nwcut` nft cut on lab-isp at priority -100 (eth2 admits udp 67/68 only, every other IPv4 datagram is dropped: link up, DHCP lease alive, upstream dead) and waits up to 60 s for the first connection that leaves via ISP-B while ISP-A stays at its baseline. It prints `failover_seconds=N` and `via=B`. BEFORE the change the service is not running, so nothing demotes wan, the second wait_via always times out, and the effect fails (expect_stdout does not match) -- that is what makes the scenario a real test of the change. OBSERVATION method: lab-isp nft counters (eth2 / eth3 packet counts on the icmp-echo-request 200-byte-payload rule)."
target = "lab-r1"
reset = ["lab-r1"]
expect = "confirmed"
timeout = 180
setup = ["dw_wanhealth_install", "dw_isp_target_on", "dw_isp_count_on"]
cleanup = ["dw_isp_count_off", "dw_isp_target_off", "dw_cut_clear"]
regression = ["mgmt_ssh", "mgmt_ssh_pw", "mgmt_ssh_newton", "mgmt_luci", "client_internet", "client_dns", "client_dhcp"]
probes = [["uci-equals", "newton_wanhealth.main.enabled", "1"]]
batch = '''
set newton_wanhealth.main=settings
set newton_wanhealth.main.enabled='1'
set newton_wanhealth.main.interval='3'
set newton_wanhealth.main.timeout='1'
set newton_wanhealth.main.down_after='3'
set newton_wanhealth.main.up_after='2'
add_list newton_wanhealth.main.target='198.51.100.9'
add_list newton_wanhealth.main.iface='wan'
add_list newton_wanhealth.main.iface='wan2'
'''

[[effect]]
device = "local"
timeout = 150
cmd = '''
. lab/dualwan-lib.sh
WH_INTERVAL=3
WH_TIMEOUT=1
WH_DOWN_AFTER=3
WH_UP_AFTER=2
WH_TARGETS=1
B=$(wh_budget "$WH_DOWN_AFTER" "$WH_INTERVAL" "$WH_TIMEOUT" "$WH_TARGETS")
nwcut_off 2>/dev/null; nwdown_off 2>/dev/null
fail() { echo "dw-01-failover: $1" >&2; nwcut_off; exit 1; }
trap 'nwcut_off' EXIT
wait_via A 20 || fail "baseline: not via ISP-A"
nwcut_on
RESULT=$(wait_via B 60) || fail "failover: timeout"
echo "$RESULT"
N=${RESULT#*seconds=}
[ "$N" -le "$B" ] || fail "failover over budget: $N s > $B s"
echo "failover_seconds=$N"
echo "via=B"
echo "budget_seconds=$B"
'''
expect_stdout = '^failover_seconds=[0-9]+$'

[[post]]
device = "lab-r1"
cmd = '''
i=$(uci -q get newton_wanhealth.main.enabled); t=$(uci -q get newton_wanhealth.main.interval); d=$(uci -q get newton_wanhealth.main.down_after); u=$(uci -q get newton_wanhealth.main.up_after)
echo "enabled=$i interval=$t down_after=$d up_after=$u targets=$(uci -q get newton_wanhealth.main.target) ifaces=$(uci -q get newton_wanhealth.main.iface)"
'''
expect_stdout = '^enabled=1 interval=3 down_after=3 up_after=2 targets=198\.51\.100\.9 ifaces=wan wan2$'