name = "ev-rules-04-hold-break-before-confirm"
description = "EV-RULES-04 proves that the owner's rules are checked again at the confirm. The scenario carries three of the four rules of EV-RULES-03 (the reach rule is not among them) and a step before the confirm that takes the default route away from the guest netns: the vantage reports the internet rule NOT-TESTED (wrong-zone: no route), which fails the local check, so the confirm is refused and the router rolls the change back at its deadline. The refusal prints the wrapper's own words and no VERIFY DETAIL line, so it cannot name the rule: the scenario pins it with expect_confirm_refused."
target = "lab-r1"
reset = ["lab-r1"]
expect = "rolled_back"
timeout = 300
setup = ["portfwd_on", "zone_probe_on", "guest_ns_on", "vantage_checks_on"]
cleanup = ["vantage_checks_off", "guest_ns_off", "zone_probe_off"]
regression = "default"
probes = [["iface-field", "guest", "up", "true"]]
hold = true
before_confirm = ["vantage_internet_break"]
batch = '''
set network.guest=interface
set network.guest.proto='static'
set network.guest.device='eth3.30'
set network.guest.ipaddr='192.168.30.1'
set network.guest.netmask='255.255.255.0'
set dhcp.guest=dhcp
set dhcp.guest.interface='guest'
set dhcp.guest.start='100'
set dhcp.guest.limit='100'
set dhcp.guest.leasetime='1h'
set firewall.guest_zone=zone
set firewall.guest_zone.name='guest'
set firewall.guest_zone.network='guest'
set firewall.guest_zone.input='REJECT'
set firewall.guest_zone.output='ACCEPT'
set firewall.guest_zone.forward='REJECT'
set firewall.guest_wan=forwarding
set firewall.guest_wan.src='guest'
set firewall.guest_wan.dest='wan'
set firewall.guest_dhcp=rule
set firewall.guest_dhcp.name='Allow-Guest-DHCP'
set firewall.guest_dhcp.src='guest'
set firewall.guest_dhcp.proto='udp'
set firewall.guest_dhcp.dest_port='67'
set firewall.guest_dhcp.target='ACCEPT'
set firewall.guest_dns=rule
set firewall.guest_dns.name='Allow-Guest-DNS'
set firewall.guest_dns.src='guest'
set firewall.guest_dns.proto='tcp udp'
set firewall.guest_dns.dest_port='53'
set firewall.guest_dns.target='ACCEPT'
'''

# The owner's rules for the guest zone, as rules.toml would carry them (the
# device is the scenario's target; the runner writes it).  Three of the four
# rules of EV-RULES-03: the reach rule is not among them.
rules = [
  { id = "guest-internet", zone = "guest", kind = "internet", label = "the guest zone reaches the internet" },
  { id = "guest-dns", zone = "guest", kind = "dns", label = "names resolve through the zone router" },
  { id = "guest-router-blocked", zone = "guest", kind = "blocked", to = "router", label = "the router admin stays blocked" },
]

# The refusal of the confirm, in the words the wrapper prints.  A refused
# confirm says no VERIFY DETAIL line, so the failed claim cannot name the
# rule that failed: this is how the scenario says what the refusal was.
expect_confirm_refused = 'the local check failed before the confirm'
