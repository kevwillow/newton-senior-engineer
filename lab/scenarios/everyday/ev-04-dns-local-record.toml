name = "ev-04-dns-local-record"
description = "Add a local DNS name to dnsmasq on lab-r1: an anonymous dhcp domain section (name='nas.lab', ip='192.168.150.77') makes the router serve 'nas.lab' on the client LAN. Before the change 'host -t A nas.lab 192.168.150.1' returns NXDOMAIN (the name is unknown) so the effect fails; after the confirmed apply the same lookup answers with that address, and uci reads the name and the ip back. No firewall change, so no approval. The plan carries a conf-has probe because the domain record is not in the generated conf: dnsmasq writes it to /tmp/hosts/dhcp.<SUF> (the addn-hosts file), so the probe must look there too."
target = "lab-r1"
reset = ["lab-r1"]
expect = "confirmed"
timeout = 60
regression = ["mgmt_ssh", "mgmt_ssh_pw", "mgmt_ssh_newton", "mgmt_luci", "client_internet", "client_dns", "client_dhcp"]
probes = [["conf-has", "dnsmasq", "substr", "present", "nas.lab"]]
batch = """add dhcp domain
set dhcp.@domain[-1].name='nas.lab'
set dhcp.@domain[-1].ip='192.168.150.77'"""

[[effect]]
device = "lab-client"
timeout = 30
cmd = "host -W 5 -t A nas.lab 192.168.150.1 | tail -1"
expect_stdout = '^nas\.lab has address 192\.168\.150\.77$'

[[post]]
device = "lab-r1"
cmd = "echo $(uci -q get dhcp.@domain[-1].name) $(uci -q get dhcp.@domain[-1].ip)"
expect_stdout = '^nas\.lab 192\.168\.150\.77$'
