name = "ev-rules-02-break-is-rolled-back"
description = "EV-RULES-02 proves that a rule that does not hold stops the change. The scenario carries three of the four rules of EV-RULES-01 (the reach rule is not among them), but its batch leaves out the guest_wan forwarding: the guest zone has no way to the internet, so the internet rule fails in the vantage round. Newton rolls the change back and names the rule that failed."
target = "lab-r1"
reset = ["lab-r1"]
expect = "rolled_back"
timeout = 300
setup = ["portfwd_on", "zone_probe_on", "guest_ns_on", "vantage_checks_on"]
cleanup = ["vantage_checks_off", "guest_ns_off", "zone_probe_off"]
regression = "default"
probes = [["iface-field", "guest", "up", "true"]]
batch = '''
set network.guest=interface
set network.guest.proto='static'
set network.guest.device='eth3.30'
set network.guest.ipaddr='192.168.30.1'
set network.guest.netmask='255.255.255.0'
set dhcp.guest=dhcp
set dhcp.guest.interface='guest'
set dhcp.guest.start='100'
set dhcp.guest.limit='100'
set dhcp.guest.leasetime='1h'
set firewall.guest_zone=zone
set firewall.guest_zone.name='guest'
set firewall.guest_zone.network='guest'
set firewall.guest_zone.input='REJECT'
set firewall.guest_zone.output='ACCEPT'
set firewall.guest_zone.forward='REJECT'
set firewall.guest_dhcp=rule
set firewall.guest_dhcp.name='Allow-Guest-DHCP'
set firewall.guest_dhcp.src='guest'
set firewall.guest_dhcp.proto='udp'
set firewall.guest_dhcp.dest_port='67'
set firewall.guest_dhcp.target='ACCEPT'
set firewall.guest_dns=rule
set firewall.guest_dns.name='Allow-Guest-DNS'
set firewall.guest_dns.src='guest'
set firewall.guest_dns.proto='tcp udp'
set firewall.guest_dns.dest_port='53'
set firewall.guest_dns.target='ACCEPT'
'''

# The three rules of EV-RULES-01 without the reach rule.  The internet rule
# is the one that fails: the batch leaves out the guest_wan forwarding, so a
# client in the guest zone has no way to the internet.
rules = [
  { id = "guest-internet", zone = "guest", kind = "internet", label = "the guest zone reaches the internet" },
  { id = "guest-dns", zone = "guest", kind = "dns", label = "names resolve through the zone router" },
  { id = "guest-router-blocked", zone = "guest", kind = "blocked", to = "router", label = "the router admin stays blocked" },
]

# The rule that failed, in the words the failed claim carries: the claim
# number is the place of the claim in the list (the scenario's own client
# checks first, then the rules) and the rule's id is not part of the text.
expect_failed_claim = "expect claim 1 failed: client in zone guest reaches the internet"
