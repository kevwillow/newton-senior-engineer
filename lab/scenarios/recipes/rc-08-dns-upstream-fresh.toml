name = "rc-08-dns-upstream-fresh"
description = "The dns-upstream recipe writes a list of two upstream servers on a router that has no server option at all, and the router's own dnsmasq conf holds both resolvers."
target = "lab-r1"
reset = ["lab-r1"]
expect = "confirmed"
timeout = 300
setup = ["portfwd_on"]
regression = "default"
recipe = "dns-upstream"
recipe_values = { server1 = "10.100.0.1", server2 = "10.101.0.1" }

[[post]]
device = "lab-r1"
cmd = "uci -q get dhcp.@dnsmasq[0].server"
expect_stdout = '^10\.100\.0\.1 10\.101\.0\.1$'
