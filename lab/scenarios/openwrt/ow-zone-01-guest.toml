name = "ow-zone-01-guest"
description = "OW-ZONE-01: a guest network. Interface guest on device eth3.30 (VLAN 30 on the client LAN port, 192.168.30.1/24), dhcp section guest, zone guest (input REJECT, output ACCEPT, forward REJECT) with forwarding guest to wan only and two rules to the router: udp 67 and tcp/udp 53. The guest client is a network namespace guest on lab-client holding eth0.30, 192.168.30.50/24, default via 192.168.30.1 (setup steps; the cleanup removes the namespace and the link even after a failure). Effects, all from inside the namespace: a tls exchange with 1.1.1.1 works (forwarding guest to wan plus the wan masquerade), the router's dnsmasq on 192.168.30.1 resolves openwrt.org (the DNS rule), and a DHCPDISCOVER on eth0.30 gets an OFFER from 192.168.30.1 in the guest pool (the DHCP rule); each was shown by hand to need its own rule (results file). Post, paired with those: from the same namespace tcp 192.168.30.1:53 connects (control), and ssh, http and https on the router's guest, mgmt and client LAN addresses and ssh on the client LAN host (lab-client's own DHCP address, read at run time) are all refused by the firewall. The router-side check makes Newton confirm only if the isolation is rendered: the guest interface is up, input_guest has the DHCP rule and ends in a reject, forward_guest accepts to wan only and ends in a reject (a zone with input or forward ACCEPT would be rolled back). The default regression runs from lab-client's own namespace and must still pass."
target = "lab-r1"
reset = ["lab-r1"]
expect = "confirmed"
setup = ["portfwd_on", "zone_probe_on", "guest_ns_on"]
cleanup = ["guest_ns_off", "zone_probe_off"]
regression = "default"
probes = [["iface-field", "guest", "up", "true"], ["nft-rule", "inet", "fw4", "input_guest", "present", "Allow-Guest-DHCP"], ["nft-rule", "inet", "fw4", "input_guest", "present", "jump reject_from_guest"], ["nft-rule", "inet", "fw4", "forward_guest", "present", "jump accept_to_wan"], ["nft-rule", "inet", "fw4", "forward_guest", "present", "jump reject_to_guest"], ["nft-rule", "inet", "fw4", "forward_guest", "absent", "jump accept_to_", "!accept_to_wan"]]
batch = '''
set network.guest=interface
set network.guest.proto='static'
set network.guest.device='eth3.30'
set network.guest.ipaddr='192.168.30.1'
set network.guest.netmask='255.255.255.0'
set dhcp.guest=dhcp
set dhcp.guest.interface='guest'
set dhcp.guest.start='100'
set dhcp.guest.limit='100'
set dhcp.guest.leasetime='1h'
set firewall.guest_zone=zone
set firewall.guest_zone.name='guest'
set firewall.guest_zone.network='guest'
set firewall.guest_zone.input='REJECT'
set firewall.guest_zone.output='ACCEPT'
set firewall.guest_zone.forward='REJECT'
set firewall.guest_wan=forwarding
set firewall.guest_wan.src='guest'
set firewall.guest_wan.dest='wan'
set firewall.guest_dhcp=rule
set firewall.guest_dhcp.name='Allow-Guest-DHCP'
set firewall.guest_dhcp.src='guest'
set firewall.guest_dhcp.proto='udp'
set firewall.guest_dhcp.dest_port='67'
set firewall.guest_dhcp.target='ACCEPT'
set firewall.guest_dns=rule
set firewall.guest_dns.name='Allow-Guest-DNS'
set firewall.guest_dns.src='guest'
set firewall.guest_dns.proto='tcp udp'
set firewall.guest_dns.dest_port='53'
set firewall.guest_dns.target='ACCEPT'
'''

[[effect]]
device = "lab-client"
timeout = 30
cmd = "sudo ip netns exec guest curl -sk -o /dev/null --max-time 8 https://1.1.1.1/ && echo 'guest netns: tls exchange with 1.1.1.1 completed'"
expect_stdout = '^guest netns: tls exchange with 1\.1\.1\.1 completed$'

[[effect]]
device = "lab-client"
timeout = 30
cmd = "sudo ip netns exec guest host -W 4 openwrt.org 192.168.30.1"
expect_stdout = 'Address: 192\.168\.30\.1#53(.|\n)*openwrt\.org has address'

[[effect]]
device = "lab-client"
timeout = 40
cmd = "sudo ip netns exec guest python3 /tmp/newton-dhcp-offer.py eth0.30 192.168.30.1"
expect_stdout = '^DHCPOFFER from 192\.168\.30\.1 yiaddr=192\.168\.30\.(1\d\d) '

[[post]]
device = "lab-client"
timeout = 90
cmd = '''
sudo ip netns exec guest bash -c '
tcp() { LC_ALL=C timeout 6 bash -c "exec 3<>/dev/tcp/$1/$2" 2>&1; }
tcp 192.168.30.1 53 >/dev/null || { echo "control failed: no tcp connect from the guest netns to the allowed 192.168.30.1:53"; exit 1; }
bad=""
for t in 192.168.30.1:22 192.168.30.1:80 192.168.30.1:443 10.109.0.11:22 10.109.0.11:443 192.168.150.1:22 192.168.150.1:443 {client_lab_ip}:22; do
  tcp ${t%:*} ${t#*:} | grep -q "Connection refused" || bad="$bad $t"
done
[ -z "$bad" ] || { echo "not refused:$bad"; exit 1; }
echo "guest netns: 192.168.30.1:53 open; refused: router 22/80/443 on 192.168.30.1, 22/443 on 10.109.0.11 and 192.168.150.1, and ssh on the client LAN host"
'
'''
expect_stdout = '^guest netns: 192\.168\.30\.1:53 open; refused: '
