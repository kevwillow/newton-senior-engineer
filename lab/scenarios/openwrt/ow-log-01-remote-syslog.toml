name = "ow-log-01-remote-syslog"
description = "OW-LOG-01: remote syslog to a host on the client LAN: system.@system[0].log_ip = lab-client's client LAN address (a var, resolved at run time), log_port='514', log_proto='udp', log_remote='1' (the default, staged explicitly). The log init script starts a second logread instance: `logread -f -h lab-r1 -r <ip> 514 -p <pidfile> -u` (logd itself keeps running, same pid). The check reads that instance's arguments from /proc, so Newton rolls the change back if the forwarder was not started. Effects: (1) the forwarder process exists with -r <log ip> 514 and -u; (2) a local probe starts a real UDP receiver on lab-client (port 514, for 12 s), has lab-r1 log three `logger` lines tagged newton-log01 with a random marker, and requires all three to arrive from 192.168.150.1 with the router's hostname and the tag; before the change nothing is sent. The receiver is a real socket on purpose, not tcpdump: with nothing listening on udp 514, lab-client answers each datagram with an ICMP port unreachable and the router's `logread -r` forwarder then drops about every other message (hand run: 12 messages one second apart, 6 captured without a receiver, 12 with one; results file), so a capture-only probe is flaky. Post: the four uci options. The default regression must still pass. Hand run, not a scenario step: after this change a second change that restarts logd (ow-log-02, log_size='512') leaves the forwarder alive with the same pid and the receiver still gets all three markers, so the two controls combine (results file)."
target = "lab-r1"
reset = ["lab-r1"]
expect = "confirmed"
setup = ["portfwd_on", "syslog_listen_on"]
cleanup = ["syslog_listen_off"]
regression = "default"
probes = [["proc-args", "logread", "-r {client_lab_ip} 514", "-u"]]
batch = '''
set system.@system[0].log_ip='{client_lab_ip}'
set system.@system[0].log_port='514'
set system.@system[0].log_proto='udp'
set system.@system[0].log_remote='1'
'''

[[effect]]
device = "lab-r1"
cmd = '''
for p in $(pidof logread); do
  c=" $(tr '\0' ' ' < /proc/$p/cmdline)"
  case "$c" in *" -r {client_lab_ip} 514 "*) case "$c" in *" -u "*) echo "logread forwarder:$c"; exit 0;; esac;; esac
done
echo "no logread forwarder with -r {client_lab_ip} 514 -u"; exit 1'''
expect_stdout = '^logread forwarder: /sbin/logread -f -h lab-r1 -r 192\.168\.150\.\d+ 514 -p /var/run/logread\.\d+\.pid -u $'

[[effect]]
device = "local"
timeout = 90
cmd = '''
sshx() { h=$1; shift; timeout 50 ssh -i "$LAB_SSH_KEY" -o BatchMode=yes -o ConnectTimeout=8 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o LogLevel=ERROR -o "ProxyCommand=$LAB_SSH_PROXY" "$h" "$@"; }
M="newton-log01-$RANDOM$RANDOM"
sshx {client_lab_user}@10.109.0.50 'sudo rm -f /tmp/newton-syslog.out; sudo sh -c "setsid python3 /tmp/newton-syslog-listen.py 12 > /tmp/newton-syslog.out 2>&1 < /dev/null &"'
sleep 2
for i in 1 2 3; do sshx root@10.109.0.11 "logger -t newton-log01 $M-$i"; sleep 1; done
sleep 8
out=$(sshx {client_lab_user}@10.109.0.50 'sudo cat /tmp/newton-syslog.out; sudo rm -f /tmp/newton-syslog.out')
n=$(echo "$out" | grep -c "newton-log01: $M-")
echo "$n of 3 marker lines reached the receiver on lab-client; first: $(echo "$out" | grep "newton-log01: $M-" | head -1 | cut -c1-110)"
[ "$n" = 3 ]'''
expect_stdout = '^3 of 3 marker lines reached the receiver on lab-client; first: 192\.168\.150\.1 <\d+>\w+ +\d+ [0-9:]+ lab-r1 newton-log01: newton-log01-\d+-1$'

[[post]]
device = "lab-r1"
cmd = "echo \"log_ip_is_client=$([ \"$(uci -q get system.@system[0].log_ip)\" = \"{client_lab_ip}\" ] && echo yes || echo no) log_port=$(uci -q get system.@system[0].log_port) log_proto=$(uci -q get system.@system[0].log_proto) log_remote=$(uci -q get system.@system[0].log_remote)\""
expect_stdout = '^log_ip_is_client=yes log_port=514 log_proto=udp log_remote=1$'
