name = "ow-fw-05-no-wan-redirects"
description = "OW-FW-05 (not UCI, audit only): no port forwards from the WAN. The audit counts the enabled redirect sections whose src is wan in the uci config (`uci show firewall` prints a redirect as `=redirect` and its zone as `src='wan'`; the stock config has 9 other rules with src='wan', so counting that string alone is wrong) and the live DNAT and redirect rules in the dstnat_wan chain (a wan redirect without dest_ip renders as `redirect to`, not `dnat`), and passes only when both are 0. No batch, so expect none. This is the scenario WITHOUT the port forward: portfwd_on is not run, so the regression is the default list minus portfwd. ow-fw-05b-wan-redirect-detected is the same audit with the port forward present and proves the audit can see one."
target = "lab-r1"
reset = ["lab-r1"]
expect = "none"
regression = ["mgmt_ssh", "mgmt_ssh_pw", "mgmt_luci", "client_internet", "client_dns", "client_dhcp"]

[[post]]
device = "lab-r1"
cmd = '''
set -f
n=0
for s in $(uci -q show firewall | sed -n 's/^firewall\.\([^.=]*\)=redirect$/\1/p'); do
  [ "$(uci -q get firewall.$s.src)" = wan ] && [ "$(uci -q get firewall.$s.enabled)" != 0 ] && n=$((n+1))
done
live=$(nft list chain inet fw4 dstnat_wan 2>/dev/null | grep -c -E ' (dnat|redirect) ')
echo "enabled uci redirects with src=wan: $n; live dnat or redirect rules in dstnat_wan: $live"
[ "$n" = 0 ] && [ "$live" = 0 ]
'''
expect_stdout = '^enabled uci redirects with src=wan: 0; live dnat or redirect rules in dstnat_wan: 0$'
