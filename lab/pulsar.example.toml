set -e
[ -r {wifi_psk_file} ] || { echo "wifi_key_install: {wifi_psk_file} is missing" >&2; exit 1; }
[ -s {wifi_psk_file} ] || { echo "wifi_key_install: {wifi_psk_file} is empty" >&2; exit 1; }
timeout 40 ssh -i "$LAB_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o UserKnownHostsFile={lab_wifi_known_hosts} -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=8 -o "ProxyCommand=$LAB_SSH_PROXY" {lab_wifi_user}@10.109.0.51 'sudo sh -c "umask 077; cat > /run/newton-psk" && sudo chown root:root /run/newton-psk && sudo chmod 600 /run/newton-psk' < {wifi_psk_file}
[ "$(timeout 40 ssh -i "$LAB_SSH_KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o UserKnownHostsFile={lab_wifi_known_hosts} -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=8 -o "ProxyCommand=$LAB_SSH_PROXY" {lab_wifi_user}@10.109.0.51 'sudo -n stat -c %a /run/newton-psk')" = 600 ] || { echo "wifi_key_install: /run/newton-psk is not mode 600" >&2; exit 1; }
echo "wifi_key_install: the key reached lab-wifi /run/newton-psk (tmpfs, mode 600, root-owned; wifi_cleanup removes it)"
'''
description = "the agent host: pipe the key file over ssh stdin into lab-wifi's /run/newton-psk (mode 600, tmpfs). Never in argv, a var or a record."

[steps.wifi_prep]
device = "lab-wifi"
timeout = 90
cmd = "sudo newton-wifi.py prep"
description = "lab-wifi: iw reg set US, rfkill unblock wifi, find the Panda by USB id 0e8d:7961, txpower fixed 100 mBm. Prints `panda IFNAME PHY`; exits 1 when the radio is absent."

[steps.wifi_cleanup]
device = "lab-wifi"
timeout = 90
cmd = '''
set -e
sudo newton-wifi.py ap stop
sudo newton-wifi.py cleanup
'''
description = "lab-wifi: stop the access point, then delete mon0, stop wpa_supplicant and dhcpcd, remove /run/newton-psk and /run/newton-wpa.conf. Idempotent, so it is safe after a failed run."

# The access point of the Wi-Fi scan scenarios: the Panda on lab-wifi as
# an OPEN access point (wpa_supplicant mode=2, key_mgmt=NONE) so the router's
# own radio has something of ours to find in a scan.  The SSID is given as
# hex, so a quote or a markup tag in the name never reaches a shell word or
# a config quoting rule, and the helper refuses any name that does not start
# with newton-test.  Only the non-DFS 5 GHz channels are allowed; 5220 MHz is
# channel 44, next to the router's own radio1 (channel 36).  The lifetime is
# hard: `timeout` ends the supplicant after --secs, so the access point
# cannot stay on.  One SSID per run: the driver allows one AP at a time.
[steps.wifi_ap_injection]
device = "lab-wifi"
timeout = 90
cmd = "sudo newton-wifi.py ap start --ssid-hex 6e6577746f6e2d746573742d3c2f756e747275737465643e53595354454d --freq 5220 --secs 120"
description = "lab-wifi: the Panda as an open access point beaconing the injection name (30 bytes, a delimiter-escape attempt), as hex, on 5220 MHz (channel 44), for at most 120 s."

[steps.wifi_ap_lookalike]
device = "lab-wifi"
timeout = 90
cmd = "sudo newton-wifi.py ap start --ssid-hex 6e6577746f6e2d746573742d496162 --freq 5220 --secs 120"
description = "lab-wifi: the Panda as an open access point beaconing the look-alike name (newton-test-Iab, a capital I for an l), as hex, on 5220 MHz (channel 44), for at most 120 s."

[steps.wifi_ap_stop]
device = "lab-wifi"
timeout = 90
cmd = "sudo newton-wifi.py ap stop"
description = "lab-wifi: stop the access point. Idempotent: it exits 0 whether or not one was running."

# The radios are off at the end of every Wi-Fi scenario (what
# `reset_after` exists for). The runner runs a scenario's regression as its
# BEFORE probes and its AFTER probes, both before reset_after, so this cannot
# sit in a Wi-Fi scenario's own regression (its radio is on after its apply):
# each of the five names it in `after_reset`, which runs straight after that
# scenario's own reset_after has restored the archive. It also runs in
# p-ow-00-baseline's regression, the first scenario after p-ev-09-wifi-radio
# in a full run's order, which reads the same state again.
[checks.p_radios_off]
device = "pulsar"
timeout = 60
cmd = '''
fail() { echo "p_radios_off: $1" >&2; exit 1; }
d=$(uci -q get wireless.default_radio1.disabled); [ "$d" = 1 ] || fail "wireless.default_radio1.disabled is '$d', not 1"
s=$(uci -q get wireless.default_radio1.ssid); [ "$s" = OpenWrt ] || fail "wireless.default_radio1.ssid is '$s', not the stock OpenWrt"
st=$(wifi status | tr -d ' \t\n')
k=$(printf '%s\n' "$st" | grep -o '"interfaces":\[[^]]*\]' | wc -l)
e=$(printf '%s\n' "$st" | grep -o '"interfaces":\[[^]]*\]' | grep -c '\[\]')
[ "$k" -ge 2 ] || fail "wifi status shows $k \"interfaces\" keys, expected one per radio"
[ "$k" = "$e" ] || fail "wifi status shows a non-empty interfaces list ($e of $k are empty)"
echo "p_radios_off: radio1 disabled=1, $k empty interfaces lists, ssid OpenWrt"
'''
expect_stdout = '^p_radios_off: '
description = "Pulsar's radios are off again: radio1 disabled=1 with the stock ssid, and every `interfaces` list in `wifi status` (one per radio) empty. A Wi-Fi scenario runs it from `after_reset`, so it also proves its reset_after restored the archive."

# The Panda is not an access point any more. The Wi-Fi scan scenarios
# start the Panda as an open AP so the router's own radio has something of
# ours to find; the scenario's cleanup stops it, and this check proves it:
# no supplicant runs the AP's config and no interface is in AP mode (the
# radio is a managed interface again). It runs from `after_reset`, next to
# p_radios_off: the radios of the router and the radio of the Panda are both
# off again at the end of a scan scenario.
[checks.p_panda_ap_off]
device = "lab-wifi"
timeout = 60
cmd = '''
fail() { echo "p_panda_ap_off: $1" >&2; exit 1; }
n=$(sudo ps -eo args= 2>/dev/null | grep -c '[w]pa_supplicant .*-c /run/newton-wpa-ap.conf' || true)
[ "$n" = 0 ] || fail "$n wpa_supplicant process(es) still run the access point"
d=$(sudo iw dev 2>&1) || fail "iw dev failed"
case "$d" in *"type ap"*) fail "an interface is still in AP mode";; esac
case "$d" in *"type managed"*) ;; *) fail "the radio has no managed interface";; esac
echo "p_panda_ap_off: no AP supplicant, no interface in AP mode, the radio is managed"
'''
expect_stdout = '^p_panda_ap_off: '
description = "lab-wifi: the Panda is not an access point any more: no wpa_supplicant runs the AP's config and `iw dev` shows no interface in AP mode (the radio is managed again). A Wi-Fi scan scenario runs it from `after_reset`, next to p_radios_off."

# The backup/restore drill: what the restore left behind, read from the
# router itself. Every Pulsar reset is the same drill - a `sysupgrade -r` of the
# baseline archive followed by a fingerprint check - and the fingerprint match
# is the runner's own, already part of every reset and reset_after: it compares
# the restored /etc/config (and the other fingerprinted files) against the
# archive's, byte for byte, and a mismatch marks abort_run (exit 2). This check
# is the other half: it asks the router for the values the drill scenario set
# and requires the archive's state back, which is what shows that a confirmed
# multi-config change does not survive the restore.
#
# It runs from a scenario's `after_reset`, i.e. after that scenario's own
# reset_after, which is the only place a check can see what a restore left. It
# prints one fixed line and nothing else when all five facts hold, and the first
# fact that fails goes to stderr with its value and exits 1.
#
# The live hostname is read through ${NEWTON_HOSTNAME_FILE:-/proc/sys/kernel/
# hostname}: on the router the variable is unset and this is /proc, and the
# override is what lets lab/tests/test_drill_scenario.py run this text for real
# against stubs instead of against /proc. Nothing else in the cmd reads it.
[checks.p_drill_restored]
device = "pulsar"
timeout = 60
cmd = '''
fail() { echo "p_drill_restored: $1" >&2; exit 1; }
u=$(uci -q get system.@system[0].hostname)
[ "$u" = Pulsar ] || fail "system.@system[0].hostname is '$u', not the archive's Pulsar"
d=$(uci -q get dhcp.drilltest)
[ -z "$d" ] || fail "dhcp.drilltest is still there ('$d')"
f=$(uci -q get firewall.drilltest)
[ -z "$f" ] || fail "firewall.drilltest is still there ('$f')"
h=$(cat ${NEWTON_HOSTNAME_FILE:-/proc/sys/kernel/hostname})
[ "$h" = Pulsar ] || fail "the live hostname is '$h', not the archive's Pulsar"
n=$(nft list ruleset | grep -c 65123)
[ "$n" -eq 0 ] || fail "65123 is still in the loaded ruleset ($n lines)"
echo "p_drill_restored: hostname=Pulsar, drilltest lease and rule gone"
'''
expect_stdout = '^p_drill_restored: '
description = "Pulsar is back at the baseline archive after a reset: system.@system[0].hostname and the live hostname are the archive's Pulsar, dhcp.drilltest and firewall.drilltest are gone and 65123 is out of the loaded ruleset. One fixed line when all five hold, else the first failing value on stderr and rc 1. That the restored state matches the archive byte for byte is the runner's own post-restore fingerprint check, already part of every reset and reset_after; this check reads the values the drill scenario set. Run from a scenario's after_reset, so it only ever sees the far side of that scenario's own reset_after."

[checks.p_wifi_client_ready]
device = "lab-wifi"
timeout = 90
cmd = "sudo newton-wifi.py prep"
expect_stdout = "^panda "
description = "lab-wifi: the Panda MT7921AU (USB 0e8d:7961) is present, the country is US and the radio came up; prep prints `panda IFNAME PHY`."
