# Example lab config for the Pulsar scenarios in lab/scenarios-pulsar/ (see the README there).
# Copy to a local file outside git (for example ~/.config/newton/pulsar/lab.toml), replace every
# placeholder path and the baseline_sha256, then run:
#   python3 lab/newton-lab-test.py --lab <your copy> --scenarios lab/scenarios-pulsar --lane key
# It is a complete lab file because the runner reads one --lab file: [pve], [ssh] and lab-isp are the same as in
# lab/lab.example.toml; [devices.pulsar] is the physical router; the vars, checks and steps below are everything the p-*
# scenarios use. A test (lab/tests/test_pulsar_example.py) fails if a scenario names something missing here.
# The Wi-Fi block at the end adds the Wi-Fi side: [devices.lab-wifi] (VM 9107, the Panda adapter passed through from
# apollo), the secret [vars.wifi_psk], the [vars.p_wifi_bssid] the p-ow-wifi-* effects pin their monitor and client
# to, the four wifi_* steps and the checks p_radios_off and p_wifi_client_ready.
#
# Placeholders: every path under ~/.config/newton/pulsar/ is yours to create (known-hosts is a pinned host key file for
# Pulsar, admin-key the root key, change-key the restricted runner key, baseline.tar.gz a `sysupgrade -b` archive taken
# with Newton installed). baseline_sha256 must be the sha256 of that archive. Nothing secret is stored in this file.
# The scenarios and checks assume Pulsar's LAN address 192.168.1.1 (the OpenWrt default) and one LAN client at the
# address in [vars.agent_ip]; change that var, and the literal client address in p-06, p-ev-06 and the http8080_on step,
# if your client differs. Pulsar is the dev router. Never point this at a production router.

[pve]
host = "192.0.2.11"
node = "Apollo"
token_file = "~/.config/pve/apollo.token"
pin_file = "~/.config/pve/apollo.pin"

[ssh]
proxy = "ssh -i ~/.ssh/claude-apollo -o BatchMode=yes -W %h:%p root@192.0.2.11"
password_file = "~/.config/newton/lab-root.pw"
key = "~/.ssh/claude-apollo"
# The runner's restricted key and the lab approval passphrase (RD7 = A): both files are created at setup time by
# `newton-router-setup lab-r1 add-key --new-key lab-runner change` and `approval-key`; they are lab-only, and the runner never
# creates or reads the passphrase file except to derive the approval token for approval = true scenarios.
router_key = "~/.ssh/newton-lab-runner"
approve_passphrase_file = "~/.config/newton/lab-approve.pw"
# Known hosts file for the key lane. Created once at lab setup from lab-r1's host key
# (ssh-keyscan through the proxy); the runner never creates or updates it. Required when
# --lane key is used: the key lane's hello preflight pins lab-r1 against this file with
# StrictHostKeyChecking=yes, and scripts/owrt-change.sh does the same whenever
# OWRT_KNOWN_HOSTS is set (otherwise ssh would fall back to the user's real
# ~/.ssh/known_hosts and either refuse an unknown router under BatchMode, or silently
# write lab-r1's key there after every snapshot reset).
known_hosts = "~/.config/newton/lab-known-hosts"

# SSH answers before OpenWrt finishes bringing interfaces up, and procd can restart dnsmasq afterward.
# Require a stable boot fingerprint before setup captures any baseline state.
[settle]
quiet_s = 10   # Seconds the successful fingerprint must remain unchanged.
timeout_s = 120 # Maximum seconds to wait for a device to settle.
poll_s = 1     # Seconds between settle fingerprint polls.

[devices.pulsar]
kind = "physical"
# The operator's statement that this device is a lab router. The loader refuses a physical device without it, and the
# runner also reads /etc/newton/device-id (must equal the table name "pulsar") and /etc/newton/profile (must be "lab")
# from the router before it changes anything. board_name is required too: it must equal /tmp/sysinfo/board_name on the
# router (read it from there; Pulsar is an ASUS RT-AX57M, "asus,rt-ax57m"). The baseline archive must also hold
# etc/newton/device-id = "pulsar" and etc/newton/profile = "lab".
lab = true
board_name = "asus,rt-ax57m"
host = "192.168.1.1"
user = "root"
proxy = false
known_hosts = "~/.config/newton/pulsar/known-hosts"
admin_key = "~/.config/newton/pulsar/admin-key"
router_key = "~/.config/newton/pulsar/change-key"
baseline_backup = "~/.config/newton/pulsar/baseline.tar.gz"
baseline_sha256 = "<sha256 of baseline.tar.gz>"
settle_cmd = "{ ubus call service list; ubus call network.interface dump | jsonfilter -e '@.interface[*].interface' -e '@.interface[*].up'; } | md5sum"

# ---- Pulsar vars, checks, regression (local only; Pulsar addresses) ----
# A var may carry `secret = true`. Its value is then substituted into the
# scenario `batch` only (a step, post, effect or check cmd that names it is
# refused before any device contact), and the runner masks it out of the
# records, the summary and the results file. None of these scenarios uses one
# yet; the shape for a Wi-Fi key in a p-ow-wireless-* batch would be:
#   [vars.wifi_psk]
#   device = "local"
#   cmd = "cat ~/.config/newton/pulsar/wifi-psk"
#   secret = true
# The file paths the scenarios and checks use. Keep each equal to the matching path above: a test compares them.
[vars.pulsar_known_hosts]
device = "local"
cmd = "echo ~/.config/newton/pulsar/known-hosts"

[vars.pulsar_admin_key]
device = "local"
cmd = "echo ~/.config/newton/pulsar/admin-key"

[vars.pulsar_runner_key]
device = "local"
cmd = "echo ~/.config/newton/pulsar/change-key"

[vars.pulsar_root_pw]
device = "local"
cmd = "echo ~/.config/newton/lab-root.pw"

[vars.fw_wan_zone]
device = "pulsar"
cmd = '''
n=$(uci show firewall | sed -n "s/^firewall\.\(@zone\[[0-9]*\]\)\.name='wan'\$/\1/p")
[ "$(echo "$n" | grep -c .)" = 1 ] && echo "$n"
'''

[vars.fw_lan_zone]
device = "pulsar"
cmd = '''
n=$(uci show firewall | sed -n "s/^firewall\.\(@zone\[[0-9]*\]\)\.name='lan'\$/\1/p")
[ "$(echo "$n" | grep -c .)" = 1 ] && echo "$n"
'''

[vars.fw_allow_ping]
device = "pulsar"
cmd = '''
n=$(uci show firewall | sed -n "s/^firewall\.\(@rule\[[0-9]*\]\)\.name='Allow-Ping'\$/\1/p")
[ "$(echo "$n" | grep -c .)" = 1 ] && echo "$n"
'''

[vars.p_wan_ip]
device = "pulsar"
cmd = '''
i=0; while [ $i -lt 25 ]; do a=$(ifstatus wan | jsonfilter -e '@["ipv4-address"][0].address'); [ -n "$a" ] && { echo "$a"; exit 0; }; sleep 1; i=$((i+1)); done; exit 1
'''

[checks.mgmt_ssh]
device = "pulsar"
cmd = "echo mgmt-ssh-ok"
expect_stdout = '^mgmt-ssh-ok$'
description = "The admin-key ssh path to Pulsar works."

[checks.mgmt_ssh_pw]
device = "local"
timeout = 60
cmd = '''
D=$(mktemp -d); trap 'rm -rf "$D"' EXIT
printf '#!/bin/sh\nexec cat %s\n' {pulsar_root_pw} > "$D/askpass"; chmod 700 "$D/askpass"
SSH_ASKPASS="$D/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=x timeout 40 ssh -o BatchMode=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=8 -o UserKnownHostsFile={pulsar_known_hosts} -o StrictHostKeyChecking=yes -o LogLevel=ERROR root@192.168.1.1 'echo mgmt-ssh-pw-ok'
'''
expect_stdout = '^mgmt-ssh-pw-ok$'
description = "Password-only ssh to Pulsar (owrt-change.sh's auth path) from the agent host on the LAN."

[checks.mgmt_ssh_newton]
device = "local"
timeout = 60
cmd = '''
timeout 40 ssh -i {pulsar_runner_key} -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=8 -o UserKnownHostsFile={pulsar_known_hosts} -o StrictHostKeyChecking=yes -o LogLevel=ERROR root@192.168.1.1 '/usr/libexec/newton/newton-router hello 0011223344556677'
'''
expect_stdout = '^hello 0011223344556677 .*door=ssh'
description = "The restricted key reaches Pulsar's newton-router (hello, door=ssh)."

[checks.mgmt_luci]
device = "local"
cmd = "curl -sk -o /dev/null -D - --max-time 10 https://192.168.1.1/"
expect_stdout = '^HTTP/\S+ 200'
description = "uhttpd answers 200 on https://192.168.1.1/ to the agent host (the LAN client)."

[checks.p_internet]
device = "pulsar"
cmd = "ping -c1 -W4 1.1.1.1 >/dev/null && echo internet-ok"
expect_stdout = '^internet-ok$'
description = "Pulsar itself reaches 1.1.1.1 (router-side; this is not a LAN-client NAT proof)."

[checks.p_dns]
device = "local"
cmd = "dig +short +time=4 +tries=1 @192.168.1.1 openwrt.org A"
expect_stdout = '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
description = "dnsmasq on 192.168.1.1 resolves an internet name for the agent host (a real LAN client query)."

[checks.p_dhcp_listen]
device = "pulsar"
cmd = "netstat -uln | grep -c ':67 ' | sed 's/^[1-9].*/dhcp-listening/'"
expect_stdout = '^dhcp-listening$'
description = "dnsmasq listens on udp 67 (router-side stand-in for the lab's DISCOVER/OFFER probe; the agent host has no passwordless root for a raw DHCP probe)."

[regression]
default = ["mgmt_ssh", "mgmt_ssh_pw", "mgmt_ssh_newton", "mgmt_luci", "p_internet", "p_dns", "p_dhcp_listen", "portfwd", "p_client_on_pulsar"]

# ---- lab-isp (ISP-A side of Pulsar's WAN), reset to its snapshot at run start ----
[devices.lab-isp]
vmid = 9101
host = "10.109.0.10"
user = "root"
snapshot = "baseline"
settle_cmd = "{ ubus call service list; ubus call network.interface dump | jsonfilter -e '@.interface[*].interface' -e '@.interface[*].up'; } | md5sum"

# The LAN client that runs the local steps and checks (a real address on Pulsar's LAN).
[vars.agent_ip]
device = "local"
cmd = "echo 192.168.1.242"

# One of the agent host's own addresses that is outside every subnet Pulsar has
# (Pulsar's LAN is 192.168.1.0/24, its WAN is 10.100.0.x from lab-isp).
# Used by p-ow-dns-02 to send a DNS query from a non-local source: a packet
# sourced from 192.0.2.10 and destined for 192.168.1.1 leaves on the
# LAN NIC (Linux lets a socket bind any local address and send it out of
# another interface), and dnsmasq logs `ignoring query from non-local
# network 192.0.2.10` because 192.0.2.0/24 is not on the router.
[vars.agent_nonlocal_ip]
device = "local"
cmd = "echo 192.0.2.10"

# The agent host's USB NIC: the one on the router's LAN.  A scenario names
# the var, so no interface name of the host is written down in the tree that
# ships; the operator's copy names the real one.
[vars.agent_usb_nic]
device = "local"
cmd = "echo enx02000000000x"

[steps.dns_nonlocal_src_check]
device = "local"
cmd = '''
a={agent_nonlocal_ip}
case "$a" in 192.168.1.*) echo "dns_nonlocal_src_check: $a is inside Pulsar's LAN 192.168.1.0/24" >&2; exit 1;; esac
ip -4 -o addr show | awk '{print $4}' | cut -d/ -f1 | grep -qxF "$a" || { echo "dns_nonlocal_src_check: the agent host does not own $a" >&2; exit 1; }
echo "dns_nonlocal_src_check: the agent host owns $a, outside 192.168.1.0/24"
'''
description = "the agent host: fail unless the agent host owns {agent_nonlocal_ip} and it is outside 192.168.1.0/24. Used by p-ow-dns-02."

[steps.dns_nonlocal_route_on]
device = "pulsar"
cmd = '''
ip route del {agent_nonlocal_ip}/32 2>/dev/null
ip route add {agent_nonlocal_ip}/32 via {agent_ip} dev br-lan
ip route | grep -qF '{agent_nonlocal_ip} via {agent_ip} dev br-lan' || { echo "dns_nonlocal_route_on: no route {agent_nonlocal_ip} via {agent_ip} dev br-lan" >&2; exit 1; }
'''
description = "pulsar: runtime route {agent_nonlocal_ip}/32 via the agent host's LAN address, so DNS replies reach the agent host. Pair with dns_nonlocal_route_off."

[steps.dns_nonlocal_route_off]
device = "pulsar"
cmd = '''
ip route del {agent_nonlocal_ip}/32 2>/dev/null
if ip route | grep -qF '{agent_nonlocal_ip} '; then echo "dns_nonlocal_route_off: the route {agent_nonlocal_ip}/32 is still there" >&2; exit 1; fi
'''
description = "pulsar: remove the runtime route {agent_nonlocal_ip}/32; fails if it is still there."

[steps.portfwd_on]
device = "pulsar"
cmd = '''
set -e
uci -q delete firewall.pf_client || true
uci set firewall.pf_client=redirect
uci set firewall.pf_client.name='pf_client'
uci set firewall.pf_client.src='wan'
uci set firewall.pf_client.src_dport='2222'
uci set firewall.pf_client.dest='lan'
uci set firewall.pf_client.dest_ip='{agent_ip}'
uci set firewall.pf_client.dest_port='22'
uci set firewall.pf_client.proto='tcp'
uci set firewall.pf_client.target='DNAT'
uci -q delete firewall.pf_masq || true
uci set firewall.pf_masq=nat
uci set firewall.pf_masq.name='pf_masq'
uci set firewall.pf_masq.src='lan'
uci set firewall.pf_masq.dest_ip='{agent_ip}'
uci set firewall.pf_masq.proto='tcp'
uci set firewall.pf_masq.target='MASQUERADE'
uci commit firewall
/etc/init.d/firewall reload
nft list ruleset | grep -q 'dport 2222' || { echo "portfwd_on: no dport 2222 rule after firewall reload" >&2; exit 1; }
'''
description = "Redirect pf_client: WAN tcp 2222 -> the agent host (the LAN client) port 22, direct uci."

[checks.portfwd]
device = "lab-isp"
cmd = "(nc {p_wan_ip} 2222 </dev/null > /tmp/b 2>/dev/null &) ; sleep 3; head -c 7 /tmp/b; rm -f /tmp/b"
expect_stdout = '^SSH-2\.0'
description = "WAN tcp 2222 on pulsar reaches the agent host's sshd, tested from lab-isp. Needs step portfwd_on."

[checks.wan_closed_refused]
device = "lab-isp"
timeout = 30
cmd = '''
t=$(mktemp); nc {p_wan_ip} 9 </dev/null >/dev/null 2>$t & n=$!
i=0; while [ ! -s $t ] && [ $i -lt 4 ]; do sleep 1; i=$((i+1)); done
r=$(cat $t); kill $n 2>/dev/null; rm -f $t
case "$r" in *refused*) echo "closed port 9 on {p_wan_ip}: refused";; "") echo "closed port 9 on {p_wan_ip}: no answer in 4 s";; *) echo "closed port 9 on {p_wan_ip}: $r";; esac
'''
expect_stdout = ': refused$'
description = "A closed tcp port on pulsar's WAN address is refused at once (wan zone input REJECT), tested from lab-isp."

[steps.http8080_on]
device = "local"
timeout = 30
cmd = '''
set -e
mkdir -p /tmp/ev-www-pulsar
printf 'newton-ev-ok\n' > /tmp/ev-www-pulsar/index.html
if [ -f /tmp/ev-http8080-pulsar.pid ]; then kill "$(cat /tmp/ev-http8080-pulsar.pid)" 2>/dev/null || true; rm -f /tmp/ev-http8080-pulsar.pid; fi
nohup python3 -m http.server 8080 --bind 192.168.1.242 --directory /tmp/ev-www-pulsar </dev/null >/tmp/ev-http8080-pulsar.out 2>&1 &
echo $! > /tmp/ev-http8080-pulsar.pid
i=0
while [ $i -lt 15 ]; do
  if curl -sf --max-time 2 http://192.168.1.242:8080/ 2>/dev/null | grep -q 'newton-ev-ok'; then echo "http8080_on: listening on the agent host 192.168.1.242:8080"; exit 0; fi
  sleep 1; i=$((i+1))
done
echo "http8080_on: listener did not answer" >&2; exit 1
'''
description = "the agent host: serve 'newton-ev-ok' on 192.168.1.242:8080 (python http.server, pid file)."

[steps.http8080_off]
device = "local"
cmd = '''
if [ -f /tmp/ev-http8080-pulsar.pid ]; then kill "$(cat /tmp/ev-http8080-pulsar.pid)" 2>/dev/null; fi
rm -rf /tmp/ev-www-pulsar /tmp/ev-http8080-pulsar.pid /tmp/ev-http8080-pulsar.out
exit 0
'''
description = "the agent host: stop the 8080 listener."

[steps.fw4_break_on]
device = "pulsar"
timeout = 30
cmd = '''
set -e
for s in $(uci show firewall | sed -n "s/^\(firewall\.[^.=]*\)\.name='ev10_broken'$/\1/p"); do uci delete "$s"; done
uci add firewall rule
uci set firewall.@rule[-1].name='ev10_broken'
uci set firewall.@rule[-1].src='wan'
uci set firewall.@rule[-1].proto='nosuchproto'
uci set firewall.@rule[-1].target='ACCEPT'
uci commit firewall
fw4 check >/tmp/fw4.out 2>&1 || rc=$? || true
rc=${rc:-0}
[ "$rc" = "1" ] || { echo "fw4_break_on: fw4 check exited $rc, expected 1; output follows:" >&2; cat /tmp/fw4.out >&2; exit 1; }
grep -q -E 'Could not resolve protocol name|Error:' /tmp/fw4.out || { echo "fw4_break_on: unexpected fw4 output" >&2; cat /tmp/fw4.out >&2; exit 1; }
rm -f /tmp/fw4.out
echo "fw4_break_on: rule ev10_broken committed; fw4 check exits 1"
'''
description = "pulsar: add a broken firewall rule by direct uci + commit (no reload)."

[steps.fw4_break_off]
device = "pulsar"
timeout = 30
cmd = '''
set -e
deleted=0
for s in $(uci show firewall | sed -n "s/^\(firewall\.[^.=]*\)\.name='ev10_broken'$/\1/p"); do uci delete "$s"; deleted=$((deleted+1)); done
uci commit firewall
fw4 check >/tmp/fw4.out 2>&1; rc=$?
[ "$rc" = "0" ] || { echo "fw4_break_off: fw4 check exited $rc after cleanup" >&2; cat /tmp/fw4.out >&2; exit 1; }
rm -f /tmp/fw4.out
echo "fw4_break_off: deleted $deleted rule(s); fw4 check exits 0"
'''
description = "pulsar: remove the broken rule."

# ---- steps cloned from repo lab.toml with device lab-r1 -> pulsar (no lab-specific literals in their cmd) ----
[steps.fw_ruleset_save]
device = "pulsar"
timeout = 120
cmd = '''
nft list ruleset | sed 's/packets [0-9]* bytes [0-9]*/packets N bytes N/' > /tmp/fw-ruleset.before
[ "$(wc -l < /tmp/fw-ruleset.before)" -gt 50 ]
'''
description = "cloned from lab.toml (device pulsar)"

[steps.fw_wan_log_on]
device = "pulsar"
timeout = 60
cmd = '''
set -e
uci set firewall.{fw_wan_zone}.log='1'
uci set firewall.{fw_wan_zone}.log_limit='10/minute'
uci commit firewall
/etc/init.d/firewall restart >/dev/null 2>&1
nft list ruleset | grep -A3 'limit wan.log_limit' | grep -q 'rate 10/minute'
'''
description = "cloned from lab.toml (device pulsar)"

[steps.fw_ipset_on]
device = "pulsar"
timeout = 60
cmd = '''
set -e
uci -q delete firewall.nw_block || true
uci -q delete firewall.nw_block_drop || true
uci set firewall.nw_block=ipset
uci set firewall.nw_block.name='nw_block'
uci set firewall.nw_block.family='ipv4'
uci set firewall.nw_block.match='src_ip'
uci add_list firewall.nw_block.entry='192.0.2.1'
uci add_list firewall.nw_block.entry='192.0.2.2'
uci set firewall.nw_block_drop=rule
uci set firewall.nw_block_drop.name='nw_block_drop'
uci set firewall.nw_block_drop.src='wan'
uci set firewall.nw_block_drop.ipset='nw_block'
uci set firewall.nw_block_drop.proto='all'
uci set firewall.nw_block_drop.target='DROP'
uci commit firewall
/etc/init.d/firewall restart >/dev/null 2>&1
s=$(nft list set inet fw4 nw_block | tr -d ' \t\n')
case "$s" in *"typeipv4_addr"*"elements={192.0.2.1,192.0.2.2}"*) ;; *) echo "fw_ipset_on: live set is not {192.0.2.1, 192.0.2.2}: $s" >&2; exit 1;; esac
nft list chain inet fw4 input_wan | grep -q '@nw_block' || { echo "fw_ipset_on: input_wan has no rule using @nw_block" >&2; exit 1; }
'''
description = "cloned from lab.toml (device pulsar)"

[steps.fw_rate_observer_start]
device = "pulsar"
timeout = 30
cmd = '''
rm -f /tmp/fw-rate.log /tmp/fw-rate.pid
cat > /tmp/fw-rate.sh <<'EOS'
last=""
while :; do
  r=$(nft list ruleset 2>/dev/null | grep -A3 'limit wan.log_limit' | grep -o 'rate [0-9]*/[a-z]*' | head -1)
  [ -n "$r" ] || r=none
  [ "$r" = "$last" ] || { echo "$(cut -d' ' -f1 /proc/uptime) $r" >> /tmp/fw-rate.log; last=$r; }
  sleep 1
done
EOS
setsid sh /tmp/fw-rate.sh </dev/null >/dev/null 2>&1 &
echo $! > /tmp/fw-rate.pid
sleep 3
[ -s /tmp/fw-rate.log ] || { echo "fw_rate_observer_start: the sampler wrote nothing to /tmp/fw-rate.log" >&2; exit 1; }
'''
description = "cloned from lab.toml (device pulsar)"

[steps.fw_rate_observer_stop]
device = "pulsar"
timeout = 120
cmd = '''
kill $(cat /tmp/fw-rate.pid) 2>/dev/null
rm -f /tmp/fw-rate.sh /tmp/fw-rate.log /tmp/fw-rate.pid
exit 0
'''
description = "cloned from lab.toml (device pulsar)"

[steps.ssh_observer_start]
device = "pulsar"
timeout = 30
cmd = '''
rm -f /tmp/ssh-observer.log /tmp/ssh-observer.pid
cat > /tmp/ssh-observer.sh <<'EOS'
while :; do
  cmd=$(tr '\0' ' ' < /proc/$(cat /var/run/dropbear.main.pid 2>/dev/null)/cmdline 2>/dev/null)
  lst=$(netstat -tln | awk '$4 ~ /:22$/ {printf "%s ", $4}')
  echo "$(date +%s)|$cmd|$lst" >> /tmp/ssh-observer.log
  sleep 1
done
EOS
setsid sh /tmp/ssh-observer.sh </dev/null >/dev/null 2>&1 &
echo $! > /tmp/ssh-observer.pid
sleep 3
[ -s /tmp/ssh-observer.log ]
'''
description = "cloned from lab.toml (device pulsar)"

[steps.ssh_observer_stop]
device = "pulsar"
timeout = 120
cmd = '''
kill $(cat /tmp/ssh-observer.pid) 2>/dev/null
rm -f /tmp/ssh-observer.sh /tmp/ssh-observer.log /tmp/ssh-observer.pid
exit 0
'''
description = "cloned from lab.toml (device pulsar)"

[steps.dns_upstream_direct]
device = "pulsar"
timeout = 60
cmd = '''
set -e
uci set dhcp.@dnsmasq[0].noresolv='1'
uci -q delete dhcp.@dnsmasq[0].server || true
uci add_list dhcp.@dnsmasq[0].server='1.1.1.1'
uci commit dhcp
/etc/init.d/dnsmasq reload
i=0
while [ $i -lt 30 ]; do
  if grep -qx 'no-resolv' /var/etc/dnsmasq.conf.* && grep -qx 'server=1.1.1.1' /var/etc/dnsmasq.conf.* && nslookup openwrt.org 127.0.0.1 2>&1 | grep -q '^Name:'; then
    echo "dns_upstream_direct: dnsmasq forwards to 1.1.1.1 only (no-resolv) and resolves"; exit 0
  fi
  sleep 1; i=$((i+1))
done
echo "dns_upstream_direct: dnsmasq does not resolve through 1.1.1.1 only after 30 s" >&2; exit 1
'''
description = "cloned from lab.toml (device pulsar)"

[steps.dns_logqueries_on]
device = "pulsar"
timeout = 60
cmd = '''
set -e
uci set dhcp.@dnsmasq[0].logqueries='1'
uci commit dhcp
/etc/init.d/dnsmasq reload
i=0
while [ $i -lt 30 ]; do
  if grep -qx 'log-queries=extra' /var/etc/dnsmasq.conf.* && nslookup openwrt.org 127.0.0.1 2>&1 | grep -q '^Name:' && logread | grep -q 'query\[A\] openwrt.org from'; then
    echo "dns_logqueries_on: dnsmasq logs every query and every forward"; exit 0
  fi
  sleep 1; i=$((i+1))
done
echo "dns_logqueries_on: dnsmasq does not log queries after 30 s" >&2; exit 1
'''
description = "cloned from lab.toml (device pulsar)"

[steps.verify_observer_start]
device = "pulsar"
timeout = 30
cmd = '''
rm -f /tmp/verify-observer.log /tmp/verify-observer.pid /tmp/verify-observer.dns
cat > /tmp/verify-observer.sh <<'EOS'
while :; do
  ping -c 1 -W 1 1.1.1.1 >/dev/null 2>&1 && p=ok || p=fail
  nslookup openwrt.org 127.0.0.1 >/tmp/verify-observer.dns 2>&1 &
  q=$!; i=0
  while kill -0 $q 2>/dev/null && [ $i -lt 3 ]; do sleep 1; i=$((i+1)); done
  if kill -0 $q 2>/dev/null; then kill $q 2>/dev/null; d=hang
  elif grep -q '^Name:' /tmp/verify-observer.dns; then d=ok; else d=fail; fi
  if cat /var/etc/dnsmasq.conf.* 2>/dev/null | grep -q '^dnssec$'; then c=yes; else c=no; fi
  v=$(uci -q get dhcp.@dnsmasq[0].dnssec); [ -n "$v" ] || v=-
  echo "$(date +%s)|cfg=$v|ping=$p|dns=$d|dnssec_in_conf=$c" >> /tmp/verify-observer.log
  sleep 1
done
EOS
setsid sh /tmp/verify-observer.sh </dev/null >/dev/null 2>&1 &
echo $! > /tmp/verify-observer.pid
sleep 5
[ -s /tmp/verify-observer.log ] || { echo "verify_observer_start: the sampler wrote nothing to /tmp/verify-observer.log" >&2; exit 1; }
'''
description = "cloned from lab.toml (device pulsar)"

[steps.verify_observer_stop]
device = "pulsar"
timeout = 120
cmd = '''
kill $(cat /tmp/verify-observer.pid) 2>/dev/null
rm -f /tmp/verify-observer.sh /tmp/verify-observer.log /tmp/verify-observer.pid /tmp/verify-observer.dns
exit 0
'''
description = "cloned from lab.toml (device pulsar)"

[steps.dhcp_state_save]
device = "pulsar"
timeout = 120
cmd = '''
c=; for p in $(pidof dnsmasq); do c=$(tr '\0' ' ' < /proc/$p/cmdline | sed -n 's/.*dnsmasq -C \([^ ]*\).*/\1/p'); [ -n "$c" ] && break; done
[ -f "$c" ] || { echo "dhcp_state_save: no conf found for the running dnsmasq" >&2; exit 1; }
{ echo "dnsmasq-conf-md5 $(md5sum < $c | cut -d' ' -f1)"; echo "dnsmasq-pids $(pidof dnsmasq | tr ' ' ',')"; echo "odhcpd-pids $(pidof odhcpd | tr ' ' ',')"; echo "ra-state $(ubus call dhcp ipv6ra | tr -d ' \t\n')"; } > /tmp/dhcp-state.before
[ "$(wc -l < /tmp/dhcp-state.before)" = 4 ] && ! grep -q 'pids $' /tmp/dhcp-state.before
'''
description = "cloned from lab.toml (device pulsar)"

# ---- sntp steps cloned with device lab-client -> local (the agent host) ----
[steps.sntp_on]
device = "local"
timeout = 120
cmd = '''
cat > /tmp/newton-sntp.py <<'EOF'
import socket, struct, sys, time

HOST, PORT = sys.argv[1], 123
NTP_EPOCH = 2208988800

def ntp_ts(t):
    return struct.pack('!II', int(t) + NTP_EPOCH, int((t - int(t)) * 2**32))

s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
s.settimeout(1.0)
t0 = time.time()
tx = ntp_ts(t0)
req = bytes([0x23]) + bytes(39) + tx
got = None
for attempt in range(3):
    s.sendto(req, (HOST, PORT))
    try:
        d, a = s.recvfrom(512)
    except socket.timeout:
        continue
    got = (d, a, time.time())
    break
if got is None:
    print('sntp %s:%d no reply' % (HOST, PORT))
    sys.exit(1)
d, a, t3 = got
if len(d) < 48:
    print('sntp reply too short: %d bytes' % len(d))
    sys.exit(1)
mode = d[0] & 7
srv_t = struct.unpack('!II', d[40:48])
srv = srv_t[0] - NTP_EPOCH + srv_t[1] / 2**32
echoed = d[24:32] == tx
print('sntp reply from %s:%d mode=%d stratum=%d li=%d originate_echoed=%s offset=%.3fs' % (a[0], a[1], mode, d[1], d[0] >> 6, 'yes' if echoed else 'no', srv - (t0 + t3) / 2))
sys.exit(0 if mode == 4 and echoed else 1)
EOF
python3 -c "import ast; ast.parse(open('/tmp/newton-sntp.py').read())" && [ -s /tmp/newton-sntp.py ]
'''
description = "cloned (device local)"

[steps.sntp_off]
device = "local"
timeout = 120
cmd = '''
rm -f /tmp/newton-sntp.py; [ ! -e /tmp/newton-sntp.py ]'''
description = "cloned (device local)"

[steps.agent_masq_on]
device = "pulsar"
timeout = 30
cmd = '''
set -e
uci -q delete firewall.pf_masq || true
uci set firewall.pf_masq=nat
uci set firewall.pf_masq.name='pf_masq'
uci set firewall.pf_masq.src='lan'
uci set firewall.pf_masq.dest_ip='{agent_ip}'
uci set firewall.pf_masq.proto='tcp'
uci set firewall.pf_masq.target='MASQUERADE'
uci commit firewall
/etc/init.d/firewall reload
nft list ruleset | grep -q 'masquerade' || { echo "agent_masq_on: no masquerade rule after reload" >&2; exit 1; }
'''
description = "pulsar: masquerade tcp towards the agent host on the lan zone. the agent host's default route is not via pulsar, so without it a forwarded WAN flow comes back asymmetrically (found by p-06)."

# In-window reboot (G4 row r02 on real hardware): a detached watcher on pulsar waits until newton-guard reports `pending`, then reboots 8 s later.
[steps.reboot_watch_on]
device = "pulsar"
timeout = 30
description = "pulsar: start a detached watcher that reboots the router 8 s after the guard goes pending (cancelled by the reboot itself)."
cmd = '''
rm -f /tmp/reboot-watch.sh
cat > /tmp/reboot-watch.sh <<'EOS'
i=0
while [ $i -lt 180 ]; do
  s=$(/usr/libexec/newton-guard status 2>/dev/null | head -1)
  case "$s" in pending*) sleep 8; echo "reboot-watch: guard pending ($s), rebooting" | logger -t reboot-watch; reboot; exit 0;; esac
  sleep 1; i=$((i+1))
done
EOS
setsid sh /tmp/reboot-watch.sh </dev/null >/dev/null 2>&1 &
sleep 1
[ -n "$(pidof sh)" ]
'''

# ---- package-install steps cloned from lab.toml with device lab-r1 -> pulsar ----
# Package swap by direct apk (pulsar reaches downloads.openwrt.org through lab-isp). Newton's rollback does not cover a package:
# only the next reset of pulsar removes it (the runner's package restore: apk del of every world entry added since the record).
# apk replaces dnsmasq with dnsmasq-full in one transaction (about 5 s), keeps /etc/config/dhcp (a new default is left beside it
# as dhcp.apk-new, which uci ignores) and the package's post-install restarts dnsmasq. The step fails loudly (rc 1 and a message
# on stderr, shown by the runner as "setup <step> failed") unless the full build is installed and running with DNS and DHCP
# bound, the stock package is gone, and ntpd has reported valid time (the init script adds --dnssec-no-timecheck until
# /var/state/dnsmasqsec exists). A DHCP answer to a real client is checked by the scenario's regression before anything is applied.
[steps.dnsmasq_full_install]
device = "pulsar"
timeout = 300
cmd = '''
fail() { echo "dnsmasq_full_install: $1" >&2; exit 1; }
apk update >/dev/null 2>&1 || fail "apk update failed (no internet on pulsar?)"
apk add dnsmasq-full >/dev/null 2>&1 || fail "apk add dnsmasq-full failed"
apk info -e dnsmasq-full >/dev/null 2>&1 || fail "dnsmasq-full is not installed after apk add"
[ "$(apk list -I | grep -c '^dnsmasq-[0-9]')" = 0 ] || fail "the stock dnsmasq package is still installed next to dnsmasq-full"
dnsmasq --version | grep -q ' DNSSEC ' || fail "dnsmasq --version does not report DNSSEC"
i=0
while [ $i -lt 40 ]; do
  if logread | grep 'dnsmasq\[' | grep 'compile time options' | tail -1 | grep -q ' DNSSEC ' && netstat -lun | grep -q ':67 ' && netstat -lun | grep -q '127.0.0.1:53 ' && nslookup openwrt.org 127.0.0.1 2>&1 | grep -q '^Name:'; then break; fi
  sleep 1; i=$((i+1))
done
[ $i -lt 40 ] || fail "dnsmasq-full is not running with DNS on 127.0.0.1:53 and DHCP on udp 67 after 40 s"
j=0
while [ ! -f /var/state/dnsmasqsec ] && [ $j -lt 120 ]; do sleep 1; j=$((j+1)); done
[ -f /var/state/dnsmasqsec ] || fail "ntpd has not reported valid time after 120 s (dnssec would run with --dnssec-no-timecheck)"
echo "dnsmasq_full_install: $(apk list -I dnsmasq-full | cut -d' ' -f1) running, DNSSEC compiled in, DNS answers, udp 67 bound, ntpd time valid ($(date -u +%H:%M:%S) UTC)"
'''
description = "cloned from lab.toml (device pulsar)"

# https-dns-proxy by direct apk. The package starts itself at install with its shipped defaults (two DoH instances, Cloudflare
# on 127.0.0.1:5053 and Google on :5054; force_dns for the interface `lan`; dnsmasq_config_update '*'), and its init script
# then edits and commits /etc/config/dhcp (noresolv, the server list, doh_* bookkeeping), restarts dnsmasq, and hands fw4
# redirect and reject rules through ubus. None of that is covered by Newton's rollback. Only the next reset of pulsar
# removes it.
[steps.https_dns_proxy_install]
device = "pulsar"
timeout = 240
cmd = '''
fail() { echo "https_dns_proxy_install: $1" >&2; exit 1; }
apk update >/dev/null 2>&1 || fail "apk update failed (no internet on pulsar?)"
apk add https-dns-proxy >/dev/null 2>&1 || fail "apk add https-dns-proxy failed"
apk info -e https-dns-proxy >/dev/null 2>&1 || fail "https-dns-proxy is not installed after apk add"
i=0
while [ $i -lt 90 ]; do
  if netstat -tln | grep -q '127.0.0.1:5053 ' && netstat -tln | grep -q '127.0.0.1:5054 ' \
     && grep -qx 'no-resolv' /var/etc/dnsmasq.conf.* && grep -qx 'server=127.0.0.1#5053' /var/etc/dnsmasq.conf.* && grep -qx 'server=127.0.0.1#5054' /var/etc/dnsmasq.conf.* \
     && nft list chain inet fw4 dstnat_lan 2>/dev/null | grep -q 'ubus:https-dns-proxy' \
     && logread | grep -q 'https-dns-proxy.*Setting trigger for wan' \
     && nslookup openwrt.org 127.0.0.1 2>&1 | grep -q '^Name:'; then
    echo "https_dns_proxy_install: $(apk list -I | grep '^https-dns-proxy-' | cut -d' ' -f1) serves dnsmasq on 127.0.0.1#5053 and #5054 (no-resolv), fw4 redirects DNS from lan, lookups work"; exit 0
  fi
  sleep 1; i=$((i+1))
done
fail "the two DoH proxies, dnsmasq's conf, the fw4 rules and a lookup are not all in place after 90 s"
'''
description = "cloned from lab.toml (device pulsar)"

[steps.miniupnpd_install]
device = "pulsar"
timeout = 180
cmd = '''
apk update >/dev/null 2>&1 || { echo "miniupnpd_install: apk update failed (no internet on pulsar?)" >&2; exit 1; }
apk add miniupnpd-nftables >/dev/null 2>&1 || { echo "miniupnpd_install: apk add miniupnpd-nftables failed" >&2; exit 1; }
apk info -e miniupnpd-nftables >/dev/null 2>&1 || { echo "miniupnpd_install: miniupnpd-nftables is not installed after apk add" >&2; exit 1; }
[ -f /etc/config/upnpd ] || { echo "miniupnpd_install: /etc/config/upnpd is missing" >&2; exit 1; }
[ "$(uci -q get upnpd.config.enabled)" = 0 ] || { echo "miniupnpd_install: shipped upnpd.config.enabled is not 0" >&2; exit 1; }
if netstat -lun | grep -q ':1900 '; then echo "miniupnpd_install: something already listens on udp 1900" >&2; exit 1; fi
'''
description = "cloned from lab.toml (device pulsar)"

# pulsar's clock is checked over the pinned admin path (the same one every
# ssh step uses). On a real router an NTP-synced clock is the difference
# between DNSSEC validation passing and SERVFAIL; the step fails loudly if
# the clock is more than 60 s away from the runner host's.
[steps.p_clock_ok]
device = "local"
timeout = 60
cmd = '''
fail() { echo "p_clock_ok: $1" >&2; exit 1; }
r=$(timeout 30 ssh -i {pulsar_admin_key} -o BatchMode=yes -o IdentitiesOnly=yes -o UserKnownHostsFile={pulsar_known_hosts} -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o ConnectTimeout=8 root@192.168.1.1 'date +%s') || fail "cannot read pulsar's clock"
l=$(date +%s)
d=$((r - l)); [ $d -lt 0 ] && d=$((0 - d))
[ $d -le 60 ] || fail "pulsar's clock is $d s away from this host's"
echo "p_clock_ok: pulsar's clock is within $d s of this host's"
'''
description = "pulsar's clock is within 60 s of the runner host's (DNSSEC validation needs a valid time). Replaces r1_clock_ok from lab.toml."

# UDP syslog receiver for ow-log-01 on Pulsar: a real socket matters (with nothing
# listening, the sender answers each datagram with an ICMP port unreachable and the
# router's `logread -r` forwarder then drops about every other message). No sudo on
# the agent host, so the receiver binds an unprivileged port. The script takes `<port>
# <seconds>` and prints "<sender ip> <datagram>" per received packet to stdout (the
# caller redirects to /tmp/newton-syslog.out, owned by the user).
[steps.syslog_listen_on]
device = "local"
cmd = '''
cat > /tmp/newton-syslog-listen.py <<'EOF'
import socket, sys, time

s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
s.bind(('0.0.0.0', int(sys.argv[1])))
s.settimeout(0.5)
end = time.time() + float(sys.argv[2])
while time.time() < end:
    try:
        d, a = s.recvfrom(4096)
    except socket.timeout:
        continue
    print('%s %s' % (a[0], d.decode('utf-8', 'replace').replace('\n', ' ')), flush=True)
EOF
python3 -c "import ast; ast.parse(open('/tmp/newton-syslog-listen.py').read())" && [ -s /tmp/newton-syslog-listen.py ]
'''
description = "the agent host: install the UDP syslog receiver /tmp/newton-syslog-listen.py taking <port> <seconds> (no sudo; the bound port must be unprivileged). Pair with syslog_listen_off."

[steps.syslog_listen_off]
device = "local"
cmd = "rm -f /tmp/newton-syslog-listen.py /tmp/newton-syslog.out; [ ! -e /tmp/newton-syslog-listen.py ] && [ ! -e /tmp/newton-syslog.out ]"
description = "the agent host: remove the syslog receiver script and its output file."

# ---- lab-client on Pulsar's lab LAN (VLAN 151 on the WAN cable) ----
# lab-client (VM 9105, Debian, the lab-client user with passwordless sudo) reaches Pulsar through the WAN cable, not
# through br-lan: apollo bridges vmbr151 and vmbr101 between the lab VMs and Pulsar's WAN port, so
# lab-client's eth0 is untagged inside VLAN 151 and lands on Pulsar's `lab` interface (192.168.151.1/24),
# while Pulsar's wan2 is DHCP on wan.101 (VLAN 101) from lab-isp's ISP-B 10.101.0.1. The zone scenarios
# add VLAN 30 and VLAN 40: lab-client's eth0.30/eth0.40 reach Pulsar's wan.30/wan.40. lab-isp (VM 9101) is
# unchanged: its eth2 is ISP-A (Pulsar's wan) and its eth3 is ISP-B (Pulsar's wan2).
# lab-client is reset from the snapshot `baseline-pulsar`, which holds exactly that layout; its management
# side (eth1, 10.109.0.50) is unchanged, so every step and check that reaches it still uses the proxy.
# A lab-r1 run (lab/lab.toml) resets lab-client back to its `baseline` snapshot, which puts it on lab-r1's
# 192.168.150.0/24 instead, so the two runs must never overlap: both hold /tmp/newton-lab.lock.

# Pulsar's second WAN: the VLAN 101 uplink from lab-isp's ISP-B. Same wait as [vars.p_wan_ip], because a
# reset boots Pulsar and the runner starts as soon as ssh answers, which can be before the second lease.
[vars.p_wan2_ip]
device = "pulsar"
cmd = '''
i=0; while [ $i -lt 25 ]; do a=$(ifstatus wan2 | jsonfilter -e '@["ipv4-address"][0].address'); [ -n "$a" ] && { echo "$a"; exit 0; }; sleep 1; i=$((i+1)); done; exit 1
'''

# The DHCP address of lab-client on Pulsar's lab LAN (eth0, the VLAN 151 uplink), read at run time.
[vars.client_lab_ip]
device = "lab-client"
cmd = "ip -4 -o addr show eth0 | awk '{print $4}' | cut -d/ -f1"

[checks.p_client_on_pulsar]
device = "lab-client"
cmd = "ip -4 route show default"
expect_stdout = '^default via 192\.168\.151\.1 dev eth0'
description = "lab-client's default route is via 192.168.151.1 on eth0. It proves lab-client is on Pulsar's lab LAN (VLAN 151 on the WAN cable) and not on lab-r1's 192.168.150.0/24, which is what the wrong snapshot would restore."

[checks.client_internet]
device = "lab-client"
cmd = "curl -sk -o /dev/null --max-time 8 https://1.1.1.1/"
description = "A TLS exchange with an internet IP literal completes through Pulsar NAT (no DNS involved)."

[checks.client_dns]
device = "lab-client"
cmd = "host -W 5 openwrt.org 192.168.151.1"
expect_stdout = 'has address'
description = "dnsmasq on 192.168.151.1 resolves an internet name for the client LAN."

[checks.client_dhcp]
device = "lab-client"
timeout = 30
# DISCOVER/OFFER only, on eth0 through a raw AF_PACKET socket: random locally administered chaddr, broadcast flag,
# no REQUEST, so no lease is created on Pulsar and lab-client's own eth0 lease (systemd-networkd) is never touched.
# dnsmasq pings the address before it offers, so a healthy OFFER takes about 3 s; the probe gives up after 12 s.
cmd = '''
sudo python3 - <<'EOF'
import os, socket, struct, sys, time

IFACE = 'eth0'
SERVER = '192.168.151.1'
WAIT = 12.0

def csum(b):
    s = sum(struct.unpack('!%dH' % (len(b) // 2), b))
    s = (s >> 16) + (s & 0xffff)
    s += s >> 16
    return ~s & 0xffff

def opts_of(buf):
    out, i = {}, 0
    while i < len(buf):
        c = buf[i]
        if c == 255:
            break
        if c == 0:
            i += 1
            continue
        out[c] = buf[i + 2:i + 2 + buf[i + 1]]
        i += 2 + buf[i + 1]
    return out

mac = bytes([0x02]) + os.urandom(5)
xid = struct.unpack('!I', os.urandom(4))[0]
nic = bytes.fromhex(open('/sys/class/net/' + IFACE + '/address').read().strip().replace(':', ''))

body = struct.pack('!BBBBIHH4s4s4s4s16s64s128s4s', 1, 1, 6, 0, xid, 0, 0x8000,
                   bytes(4), bytes(4), bytes(4), bytes(4), mac + bytes(10), bytes(64), bytes(128),
                   b'\x63\x82\x53\x63')
body += b'\x35\x01\x01' + b'\x3d\x07\x01' + mac + b'\x37\x05\x01\x03\x06\x0f\x33' + b'\xff'
body += bytes(max(0, 300 - len(body)))
udp = struct.pack('!HHHH', 68, 67, 8 + len(body), 0) + body
ip = struct.pack('!BBHHHBBH4s4s', 0x45, 0, 20 + len(udp), 0, 0, 64, 17, 0, bytes(4), b'\xff' * 4)
ip = ip[:10] + struct.pack('!H', csum(ip)) + ip[12:]
frame = b'\xff' * 6 + nic + b'\x08\x00' + ip + udp

s = socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(0x0800))
s.bind((IFACE, 0))
t0 = time.time()
nxt = 0.0
while time.time() - t0 < WAIT:
    if time.time() - t0 >= nxt:
        s.send(frame)
        nxt += 4.0
    s.settimeout(0.5)
    try:
        pkt, info = s.recvfrom(4096)
    except socket.timeout:
        continue
    if info[2] == socket.PACKET_OUTGOING or len(pkt) < 14 + 20 + 8 + 240:
        continue
    ihl = (pkt[14] & 0x0f) * 4
    if pkt[14 + 9] != 17:
        continue
    sport, dport = struct.unpack('!HH', pkt[14 + ihl:14 + ihl + 4])
    d = pkt[14 + ihl + 8:]
    if sport != 67 or dport != 68 or len(d) < 240 or d[0] != 2:
        continue
    if struct.unpack('!I', d[4:8])[0] != xid or d[28:34] != mac or d[236:240] != b'\x63\x82\x53\x63':
        continue
    o = opts_of(d[240:])
    if o.get(53) != b'\x02':
        continue
    srv = socket.inet_ntoa(pkt[14 + 12:14 + 16])
    if srv != SERVER:
        continue
    print('DHCPOFFER from %s yiaddr=%s after %.1fs (chaddr %s, no REQUEST sent)' % (
        srv, socket.inet_ntoa(d[16:20]), time.time() - t0, ':'.join('%02x' % b for b in mac)))
    sys.exit(0)
print('no DHCPOFFER from %s on %s within %.0fs' % (SERVER, IFACE, WAIT))
sys.exit(1)
EOF
'''
expect_stdout = '^DHCPOFFER from 192\.168\.151\.1 '
description = "Pulsar answers a fresh DHCPDISCOVER on the client LAN with an OFFER (random MAC, nothing leased)."

[checks.client_ext_dns]
device = "lab-client"
cmd = "host -W 5 openwrt.org 1.1.1.1"
expect_stdout = 'has address'
description = "The client can query 1.1.1.1 on port 53 directly. Breaks target for p-ow-dns-08."

[checks.client_dot]
device = "lab-client"
cmd = "timeout 6 bash -c 'exec 3<>/dev/tcp/1.1.1.1/853' && echo dot-open"
expect_stdout = '^dot-open$'
description = "The client can open tcp 853 to 1.1.1.1. Breaks target for p-ow-dns-07."

[checks.client_isp_ssh]
device = "lab-client"
timeout = 30
cmd = "timeout 6 bash -c 'exec 3<>/dev/tcp/10.100.0.1/22' && echo open"
expect_stdout = '^open$'
description = "The client can open tcp 22 to lab-isp at 10.100.0.1 (lab-isp's ispa-side address, reached through Pulsar NAT). Breaks target for p-ev-07."

# ---- lab-client steps cloned from lab.toml (the probe scripts, the zone namespaces and the dualwan
# lab-isp steps). lab-client's eth0, eth0.30, eth0.40 and eth1 are unchanged; only the router's
# device names differ, and they appear nowhere in these cmds.
[devices.lab-client]
vmid = 9105
host = "10.109.0.50"
user = "labuser"
snapshot = "baseline-pulsar"
settle_cmd = 'systemctl is-system-running && [ "$(systemctl list-jobs --no-legend | wc -l)" = 0 ] && echo idle'

# The user names the scenarios' own ssh commands use.  They are vars and not literals because a scenario
# ships: the command names the var, the var resolves to the user of the device table (id -un over the
# runner's own ssh), so the live lab keeps working and no user name is written down.  Replace the two
# user names above with the ones the lab VMs really have.
[vars.client_lab_user]
device = "lab-client"
cmd = "id -un"

[vars.lab_wifi_user]
device = "lab-wifi"
cmd = "id -un"

# Raw TCP segments from lab-client (python3 stdlib, run with sudo): `newton-tcpraw.py DST DPORT COUNT FLAGS [GAP_S]
# [--min N] [--max N]` sends COUNT segments with the given TCP flags (0x02 SYN, 0x03 SYN+FIN) from distinct source
# ports, counts the distinct ports that got any TCP answer (RST or SYN-ACK) within 2 s, prints one line and exits 1 when
# the count is outside [--min, --max]. Used to measure the router's own input chain: SYN flood limiter (25/s, burst 50)
# and the invalid-packet drop. The receive buffer is forced to 8 MB because the replies are read after the send loop.
[steps.tcpraw_on]
device = "lab-client"
cmd = '''
cat > /tmp/newton-tcpraw.py <<'EOF'
import argparse, random, socket, struct, sys, time

def csum(b):
    if len(b) % 2:
        b += b'\0'
    s = sum(struct.unpack('!%dH' % (len(b) // 2), b))
    s = (s >> 16) + (s & 0xffff)
    s += s >> 16
    return ~s & 0xffff

def segment(src, dst, sport, dport, flags):
    tcp = struct.pack('!HHIIBBHHH', sport, dport, random.getrandbits(32), 0, 5 << 4, flags, 1024, 0, 0)
    pseudo = socket.inet_aton(src) + socket.inet_aton(dst) + struct.pack('!BBH', 0, 6, len(tcp))
    tcp = tcp[:16] + struct.pack('!H', csum(pseudo + tcp)) + tcp[18:]
    ip = struct.pack('!BBHHHBBH4s4s', 0x45, 0, 20 + len(tcp), random.getrandbits(16), 0, 64, 6, 0,
                     socket.inet_aton(src), socket.inet_aton(dst))
    return ip[:10] + struct.pack('!H', csum(ip)) + ip[12:] + tcp

ap = argparse.ArgumentParser()
ap.add_argument('dst')
ap.add_argument('dport', type=int)
ap.add_argument('count', type=int)
ap.add_argument('flags')
ap.add_argument('gap', type=float, nargs='?', default=0.0)
ap.add_argument('--min', type=int, default=0)
ap.add_argument('--max', type=int, default=None)
a = ap.parse_args()
dst, dport, count, flags, gap = a.dst, a.dport, a.count, int(a.flags, 0), a.gap
lo, hi = a.min, (a.max if a.max is not None else a.count)
probe = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
probe.connect((dst, 9))
src = probe.getsockname()[0]
probe.close()
rx = socket.socket(socket.AF_INET, socket.SOCK_RAW, socket.IPPROTO_TCP)
rx.setsockopt(socket.SOL_SOCKET, getattr(socket, 'SO_RCVBUFFORCE', 33), 8 << 20)
tx = socket.socket(socket.AF_INET, socket.SOCK_RAW, socket.IPPROTO_RAW)
base = random.randint(20000, 50000)
for i in range(count):
    tx.sendto(segment(src, dst, base + i, dport, flags), (dst, 0))
    if gap:
        time.sleep(gap)
got = set()
rx.settimeout(0.3)
end = time.time() + 2.0
while time.time() < end:
    try:
        buf, addr = rx.recvfrom(4096)
    except socket.timeout:
        continue
    if addr[0] != dst:
        continue
    ihl = (buf[0] & 15) * 4
    sp, dp = struct.unpack('!HH', buf[ihl:ihl + 4])
    if sp == dport and base <= dp < base + count:
        got.add(dp)
ok = lo <= len(got) <= hi
print('sent=%d answered=%d flags=0x%02x to %s:%d (allowed %d..%d) %s' % (count, len(got), flags, dst, dport, lo, hi, 'OK' if ok else 'OUT OF RANGE'))
sys.exit(0 if ok else 1)
EOF
python3 -c "import ast; ast.parse(open('/tmp/newton-tcpraw.py').read())" && [ -s /tmp/newton-tcpraw.py ]
'''
description = "Install the raw TCP segment sender /tmp/newton-tcpraw.py on lab-client (see the comment above). Pair with tcpraw_off."

[steps.tcpraw_off]
device = "lab-client"
cmd = "rm -f /tmp/newton-tcpraw.py; [ ! -e /tmp/newton-tcpraw.py ]"
description = "Remove /tmp/newton-tcpraw.py from lab-client."

# Zone clients on lab-client (p-ow-zone-01 guest, p-ow-zone-02 IoT). A zone client is a network namespace holding one 802.1Q
# sub-interface of eth0 (apollo's vmbr151 is a plain bridge, so tagged frames pass between lab-client and the WAN cable, where
# the router side is an interface on device wan.<vid>). The `_on` steps are idempotent: they first kill the processes in the
# namespace, delete the namespace and the link if they exist, then create everything; the `_off` steps do the same removal,
# unload 8021q if nothing else uses it (it was not loaded before), and fail if anything is left.
# The 8021q module is loaded by `ip link add ... type vlan` on demand.
[steps.guest_ns_on]
device = "lab-client"
cmd = '''
set -e
sudo ip netns pids guest 2>/dev/null | xargs -r sudo kill 2>/dev/null || true
sudo ip netns del guest 2>/dev/null || true
sudo ip link del eth0.30 2>/dev/null || true
sudo ip netns add guest
sudo ip link add link eth0 name eth0.30 type vlan id 30
sudo ip link set eth0.30 netns guest
sudo ip netns exec guest ip link set lo up
sudo ip netns exec guest ip link set eth0.30 up
sudo ip netns exec guest ip addr add 192.168.30.50/24 dev eth0.30
sudo ip netns exec guest ip route add default via 192.168.30.1
sudo ip netns exec guest ip -4 -br addr show eth0.30 | grep -q 192.168.30.50
'''
description = "lab-client: namespace guest with eth0.30 (VLAN 30 on eth0), 192.168.30.50/24, default via 192.168.30.1 (Pulsar's wan.30)."

[steps.guest_ns_off]
device = "lab-client"
cmd = '''
sudo ip netns pids guest 2>/dev/null | xargs -r sudo kill 2>/dev/null || true
sudo ip netns del guest 2>/dev/null || true
sudo ip link del eth0.30 2>/dev/null || true
sudo modprobe -r 8021q 2>/dev/null || true
! ip netns list | grep -qw guest && ! ip link show eth0.30 >/dev/null 2>&1
'''
description = "lab-client: remove namespace guest and the eth0.30 link (also after a failed run); fails if either is left."

[steps.iot_ns_on]
device = "lab-client"
cmd = '''
set -e
sudo ip netns pids iot 2>/dev/null | xargs -r sudo kill 2>/dev/null || true
sudo ip netns del iot 2>/dev/null || true
sudo ip link del eth0.40 2>/dev/null || true
sudo ip netns add iot
sudo ip link add link eth0 name eth0.40 type vlan id 40
sudo ip link set eth0.40 netns iot
sudo ip netns exec iot ip link set lo up
sudo ip netns exec iot ip link set eth0.40 up
sudo ip netns exec iot ip addr add 192.168.40.50/24 dev eth0.40
sudo ip netns exec iot ip route add default via 192.168.40.1
sudo ip netns exec iot ip -4 -br addr show eth0.40 | grep -q 192.168.40.50
# the IoT "device": a tcp service on 8080 that greets and closes (socat, started detached inside the namespace)
sudo ip netns exec iot setsid socat TCP-LISTEN:8080,fork,reuseaddr SYSTEM:'echo iot-host-ok' </dev/null >/dev/null 2>&1 &
sleep 1
sudo ip netns exec iot ss -ltn | grep -q ':8080 '
'''
description = "lab-client: namespace iot with eth0.40 (VLAN 40 on eth0), 192.168.40.50/24, default via 192.168.40.1 (Pulsar's wan.40), and a socat tcp 8080 greeter inside it."

[steps.iot_ns_off]
device = "lab-client"
cmd = '''
sudo ip netns pids iot 2>/dev/null | xargs -r sudo kill 2>/dev/null || true
sleep 1
sudo ip netns del iot 2>/dev/null || true
sudo ip link del eth0.40 2>/dev/null || true
sudo modprobe -r 8021q 2>/dev/null || true
! ip netns list | grep -qw iot && ! ip link show eth0.40 >/dev/null 2>&1
'''
description = "lab-client: kill the processes in namespace iot, remove it and the eth0.40 link (also after a failed run); fails if either is left."

# DHCP offer probe for a zone client: `python3 /tmp/newton-dhcp-offer.py IFACE SERVER`, run inside the namespace. Same
# method as the client_dhcp check (random chaddr, raw AF_PACKET DISCOVER, wait for the OFFER, never send a REQUEST, so no
# lease is taken), with the interface and the expected server as arguments.
[steps.zone_probe_on]
device = "lab-client"
cmd = '''
cat > /tmp/newton-dhcp-offer.py <<'EOF'
import os, socket, struct, sys, time

IFACE, SERVER, WAIT = sys.argv[1], sys.argv[2], 12.0

def csum(b):
    s = sum(struct.unpack('!%dH' % (len(b) // 2), b))
    s = (s >> 16) + (s & 0xffff)
    s += s >> 16
    return ~s & 0xffff

def opts_of(buf):
    out, i = {}, 0
    while i < len(buf):
        c = buf[i]
        if c == 255:
            break
        if c == 0:
            i += 1
            continue
        out[c] = buf[i + 2:i + 2 + buf[i + 1]]
        i += 2 + buf[i + 1]
    return out

mac = bytes([0x02]) + os.urandom(5)
xid = struct.unpack('!I', os.urandom(4))[0]
nic = bytes.fromhex(open('/sys/class/net/' + IFACE + '/address').read().strip().replace(':', ''))
body = struct.pack('!BBBBIHH4s4s4s4s16s64s128s4s', 1, 1, 6, 0, xid, 0, 0x8000,
                   bytes(4), bytes(4), bytes(4), bytes(4), mac + bytes(10), bytes(64), bytes(128),
                   b'\x63\x82\x53\x63')
body += b'\x35\x01\x01' + b'\x3d\x07\x01' + mac + b'\x37\x05\x01\x03\x06\x0f\x33' + b'\xff'
body += bytes(max(0, 300 - len(body)))
udp = struct.pack('!HHHH', 68, 67, 8 + len(body), 0) + body
ip = struct.pack('!BBHHHBBH4s4s', 0x45, 0, 20 + len(udp), 0, 0, 64, 17, 0, bytes(4), b'\xff' * 4)
ip = ip[:10] + struct.pack('!H', csum(ip)) + ip[12:]
frame = b'\xff' * 6 + nic + b'\x08\x00' + ip + udp
s = socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(0x0800))
s.bind((IFACE, 0))
t0 = time.time()
nxt = 0.0
while time.time() - t0 < WAIT:
    if time.time() - t0 >= nxt:
        s.send(frame)
        nxt += 4.0
    s.settimeout(0.5)
    try:
        pkt, info = s.recvfrom(4096)
    except socket.timeout:
        continue
    if info[2] == socket.PACKET_OUTGOING or len(pkt) < 14 + 20 + 8 + 240:
        continue
    ihl = (pkt[14] & 0x0f) * 4
    if pkt[14 + 9] != 17:
        continue
    sport, dport = struct.unpack('!HH', pkt[14 + ihl:14 + ihl + 4])
    d = pkt[14 + ihl + 8:]
    if sport != 67 or dport != 68 or len(d) < 240 or d[0] != 2:
        continue
    if struct.unpack('!I', d[4:8])[0] != xid or d[28:34] != mac or d[236:240] != b'\x63\x82\x53\x63':
        continue
    o = opts_of(d[240:])
    if o.get(53) != b'\x02':
        continue
    srv = socket.inet_ntoa(pkt[14 + 12:14 + 16])
    if srv != SERVER:
        continue
    print('DHCPOFFER from %s yiaddr=%s after %.1fs (no REQUEST sent)' % (srv, socket.inet_ntoa(d[16:20]), time.time() - t0))
    sys.exit(0)
print('no DHCPOFFER from %s on %s within %.0fs' % (SERVER, IFACE, WAIT))
sys.exit(1)
EOF
python3 -c "import ast; ast.parse(open('/tmp/newton-dhcp-offer.py').read())" && [ -s /tmp/newton-dhcp-offer.py ]
'''
description = "Install the DHCP offer probe /tmp/newton-dhcp-offer.py on lab-client (see the comment above). Pair with zone_probe_off."

[steps.zone_probe_off]
device = "lab-client"
cmd = "rm -f /tmp/newton-dhcp-offer.py; [ ! -e /tmp/newton-dhcp-offer.py ]"
description = "Remove /tmp/newton-dhcp-offer.py from lab-client."

# DHCP probe with requested addresses: `sudo python3 /tmp/newton-dhcp-probe.py IFACE SERVER [REQUESTED_IP|none]...`. One raw
# AF_PACKET DISCOVER per argument (random chaddr, broadcast flag, option 50 = the requested address unless "none"), no REQUEST
# ever sent, so no lease is taken. dnsmasq answers a DISCOVER with the requested address when it lies inside a dynamic range
# and is free, otherwise with an address of its own choosing from the pool, so the offered address shows where the pool ends.
# dnsmasq pings each candidate for about 3 s before it offers and handles one at a time, so the probe waits up to 30 s.
# Prints one line per argument: "requested X offered Y chaddr M" or "requested X no OFFER from S within 30s"; exit 1 if any is missing.
[steps.dhcp_probe_on]
device = "lab-client"
cmd = '''
cat > /tmp/newton-dhcp-probe.py <<'EOF'
import os, socket, struct, sys, time

IFACE, SERVER = sys.argv[1], sys.argv[2]
REQS = sys.argv[3:] or ['none']
WAIT = 30.0

def csum(b):
    s = sum(struct.unpack('!%dH' % (len(b) // 2), b))
    s = (s >> 16) + (s & 0xffff)
    s += s >> 16
    return ~s & 0xffff

def opts_of(buf):
    out, i = {}, 0
    while i < len(buf):
        c = buf[i]
        if c == 255:
            break
        if c == 0:
            i += 1
            continue
        out[c] = buf[i + 2:i + 2 + buf[i + 1]]
        i += 2 + buf[i + 1]
    return out

nic = bytes.fromhex(open('/sys/class/net/' + IFACE + '/address').read().strip().replace(':', ''))

def discover(mac, xid, req):
    body = struct.pack('!BBBBIHH4s4s4s4s16s64s128s4s', 1, 1, 6, 0, xid, 0, 0x8000,
                       bytes(4), bytes(4), bytes(4), bytes(4), mac + bytes(10), bytes(64), bytes(128),
                       b'\x63\x82\x53\x63')
    body += b'\x35\x01\x01' + b'\x3d\x07\x01' + mac
    if req != 'none':
        body += b'\x32\x04' + socket.inet_aton(req)
    body += b'\x37\x05\x01\x03\x06\x0f\x33' + b'\xff'
    body += bytes(max(0, 300 - len(body)))
    udp = struct.pack('!HHHH', 68, 67, 8 + len(body), 0) + body
    ip = struct.pack('!BBHHHBBH4s4s', 0x45, 0, 20 + len(udp), 0, 0, 64, 17, 0, bytes(4), b'\xff' * 4)
    ip = ip[:10] + struct.pack('!H', csum(ip)) + ip[12:]
    return b'\xff' * 6 + nic + b'\x08\x00' + ip + udp

want = {}
for req in REQS:
    mac = bytes([0x02]) + os.urandom(5)
    xid = struct.unpack('!I', os.urandom(4))[0]
    want[xid] = (req, mac, discover(mac, xid, req))
s = socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(0x0800))
s.bind((IFACE, 0))
got = {}
t0 = time.time()
nxt = 0.0
while time.time() - t0 < WAIT and len(got) < len(want):
    if time.time() - t0 >= nxt:
        for xid, (req, mac, frame) in want.items():
            if xid not in got:
                s.send(frame)
        nxt += 6.0
    s.settimeout(0.5)
    try:
        pkt, info = s.recvfrom(4096)
    except socket.timeout:
        continue
    if info[2] == socket.PACKET_OUTGOING or len(pkt) < 14 + 20 + 8 + 240:
        continue
    ihl = (pkt[14] & 0x0f) * 4
    if pkt[14 + 9] != 17:
        continue
    sport, dport = struct.unpack('!HH', pkt[14 + ihl:14 + ihl + 4])
    d = pkt[14 + ihl + 8:]
    if sport != 67 or dport != 68 or len(d) < 240 or d[0] != 2:
        continue
    xid = struct.unpack('!I', d[4:8])[0]
    if xid not in want or d[28:34] != want[xid][1] or d[236:240] != b'\x63\x82\x53\x63':
        continue
    if opts_of(d[240:]).get(53) != b'\x02':
        continue
    if socket.inet_ntoa(pkt[14 + 12:14 + 16]) != SERVER:
        continue
    got[xid] = socket.inet_ntoa(d[16:20])
bad = 0
for xid, (req, mac, frame) in want.items():
    if xid in got:
        print('requested %s offered %s chaddr %s' % (req, got[xid], ':'.join('%02x' % b for b in mac)))
    else:
        print('requested %s no OFFER from %s within %.0fs' % (req, SERVER, WAIT))
        bad += 1
sys.exit(1 if bad else 0)
EOF
python3 -c "import ast; ast.parse(open('/tmp/newton-dhcp-probe.py').read())" && [ -s /tmp/newton-dhcp-probe.py ]
'''
description = "Install the DHCP probe with requested addresses /tmp/newton-dhcp-probe.py on lab-client (see the comment above). Pair with dhcp_probe_off."

[steps.dhcp_probe_off]
device = "lab-client"
cmd = "rm -f /tmp/newton-dhcp-probe.py; [ ! -e /tmp/newton-dhcp-probe.py ]"
description = "Remove /tmp/newton-dhcp-probe.py from lab-client."

# DHCP probe with a chosen chaddr: `sudo python3 /tmp/newton-dhcp-probe-mac.py IFACE SERVER MAC [MAC...]`. One raw AF_PACKET
# DISCOVER per argument (the chaddr is the given MAC, broadcast flag, no option 50, no REQUEST ever sent, so no lease is
# taken). A DISCOVER from a MAC that has a static lease gets the lease address back in yiaddr; one from a MAC that has no
# lease gets a pool address. dnsmasq pings each candidate for about 3 s before it offers and handles one at a time, so the
# probe waits up to 30 s. Prints one line per argument: "chaddr M offered Y" or "chaddr M no OFFER from S within 30s"; exit
# 1 if any is missing.
[steps.dhcp_probe_mac_on]
device = "lab-client"
cmd = '''
cat > /tmp/newton-dhcp-probe-mac.py <<'EOF'
import os, socket, struct, sys, time

IFACE, SERVER = sys.argv[1], sys.argv[2]
MACS = sys.argv[3:]
WAIT = 30.0

def csum(b):
    s = sum(struct.unpack('!%dH' % (len(b) // 2), b))
    s = (s >> 16) + (s & 0xffff)
    s += s >> 16
    return ~s & 0xffff

def opts_of(buf):
    out, i = {}, 0
    while i < len(buf):
        c = buf[i]
        if c == 255:
            break
        if c == 0:
            i += 1
            continue
        out[c] = buf[i + 2:i + 2 + buf[i + 1]]
        i += 2 + buf[i + 1]
    return out

nic = bytes.fromhex(open('/sys/class/net/' + IFACE + '/address').read().strip().replace(':', ''))

def discover(mac, xid):
    body = struct.pack('!BBBBIHH4s4s4s4s16s64s128s4s', 1, 1, 6, 0, xid, 0, 0x8000,
                       bytes(4), bytes(4), bytes(4), bytes(4), mac + bytes(10), bytes(64), bytes(128),
                       b'\x63\x82\x53\x63')
    body += b'\x35\x01\x01' + b'\x3d\x07\x01' + mac
    body += b'\x37\x05\x01\x03\x06\x0f\x33' + b'\xff'
    body += bytes(max(0, 300 - len(body)))
    udp = struct.pack('!HHHH', 68, 67, 8 + len(body), 0) + body
    ip = struct.pack('!BBHHHBBH4s4s', 0x45, 0, 20 + len(udp), 0, 0, 64, 17, 0, bytes(4), b'\xff' * 4)
    ip = ip[:10] + struct.pack('!H', csum(ip)) + ip[12:]
    return b'\xff' * 6 + nic + b'\x08\x00' + ip + udp

want = {}
for mac_str in MACS:
    mac = bytes.fromhex(mac_str.replace(':', '').replace('-', ''))
    xid = struct.unpack('!I', os.urandom(4))[0]
    want[xid] = (mac_str, mac, discover(mac, xid))
s = socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(0x0800))
s.bind((IFACE, 0))
got = {}
t0 = time.time()
nxt = 0.0
while time.time() - t0 < WAIT and len(got) < len(want):
    if time.time() - t0 >= nxt:
        for xid, (mac_str, mac, frame) in want.items():
            if xid not in got:
                s.send(frame)
        nxt += 6.0
    s.settimeout(0.5)
    try:
        pkt, info = s.recvfrom(4096)
    except socket.timeout:
        continue
    if info[2] == socket.PACKET_OUTGOING or len(pkt) < 14 + 20 + 8 + 240:
        continue
    ihl = (pkt[14] & 0x0f) * 4
    if pkt[14 + 9] != 17:
        continue
    sport, dport = struct.unpack('!HH', pkt[14 + ihl:14 + ihl + 4])
    d = pkt[14 + ihl + 8:]
    if sport != 67 or dport != 68 or len(d) < 240 or d[0] != 2:
        continue
    xid = struct.unpack('!I', d[4:8])[0]
    if xid not in want or d[28:34] != want[xid][1] or d[236:240] != b'\x63\x82\x53\x63':
        continue
    if opts_of(d[240:]).get(53) != b'\x02':
        continue
    if socket.inet_ntoa(pkt[14 + 12:14 + 16]) != SERVER:
        continue
    got[xid] = socket.inet_ntoa(d[16:20])
bad = 0
for xid, (mac_str, mac, frame) in want.items():
    if xid in got:
        print('chaddr %s offered %s' % (mac_str, got[xid]))
    else:
        print('chaddr %s no OFFER from %s within %.0fs' % (mac_str, SERVER, WAIT))
        bad += 1
sys.exit(1 if bad else 0)
EOF
python3 -c "import ast; ast.parse(open('/tmp/newton-dhcp-probe-mac.py').read())" && [ -s /tmp/newton-dhcp-probe-mac.py ]
'''
