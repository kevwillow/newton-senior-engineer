name = "p-12-tier-lockdown"
description = "PULSAR PORT of 12-tier-lockdown: only target, reset device and the post device changed (lab vars fw_wan_zone and fw_allow_ping resolve on pulsar in the local config). The tier file skips lab-bound blocks, so only portable controls apply. Original text: Live proof of the lockdown tier: lockdown changes management access (dropbear DirectInterface, LuCI session lifetime, console login, WAN ping off, anti-spoof and bogon blocks, IoT zone isolation, DNS redirect, DoT and outbound DNS blocks) and the only safe recovery is a snapshot reset through the serial console (lab/lab-serial.sh is the serial console). The proof restores pulsar from the baseline sysupgrade archive, applies every batch of profiles/openwrt/lockdown.uci in order through the same splitter newton_plan_tier uses (cap 16 so the live proof runs several small ordered batches), then reboots and re-runs every batch's sealed probes plus the rollback-hash check. Lockdown needs the WAN firewall zone id AND the Allow-Ping rule id; values come from lab.toml [vars] fw_wan_zone and fw_allow_ping."
target = "pulsar"
reset = ["pulsar"]
expect = "confirmed"
timeout = 180
tier = "lockdown"
tier_reboot = true
tier_batch_lines = 16
tier_fail_probe = ["conf-has", "dnsmasq", "substr", "present", "newton-tier-rollback-marker-never-present"]
tier_values = { fw_wan_zone = "{fw_wan_zone}", fw_allow_ping = "{fw_allow_ping}" }

[[post]]
device = "pulsar"
cmd = "uci changes | wc -l"
expect_stdout = "^0$"