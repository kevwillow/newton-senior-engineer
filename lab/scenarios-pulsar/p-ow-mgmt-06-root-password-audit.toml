# PORT of ow-mgmt-06. Changed: lab-r1 -> pulsar; regression -> pulsar's checks. Pulsar's root password was set to the lab root password so a HASH is expected.
name = "p-ow-mgmt-06-root-password-audit"
description = "OW-MGMT-06 (not UCI, audit only): the root password field of /etc/shadow is a real hash. The classifier prints one word: EMPTY (no password), LOCKED (field starts with * or !, so also !<hash>), HASH, NOROOT or MULTIROOT; it never prints the field. No batch, so expect none. The default regression runs before and after as in ow-00-baseline: nothing is applied, so it only shows that the baseline is healthy while the audit runs. It also keeps this scenario above about 35 s, which the next scenario's reset needs: qm cleanup holds the VM config lock for about 35 s after a rollback and a reset that starts sooner can fail with a lock timeout (results file). pulsar at baseline-pw has the lab password, so HASH; the classifier was shown to print EMPTY, LOCKED and NOROOT on the live file (results file)."
target = "pulsar"
reset = ["pulsar"]
expect = "none"
setup = ["portfwd_on"]
regression = "default"

[[post]]
device = "pulsar"
cmd = '''
awk -F: '$1=="root"{n++; f=$2; c=(f==""?"EMPTY":(f~/^[*!]/?"LOCKED":"HASH"))} END{if(n==0)print "NOROOT"; else if(n>1)print "MULTIROOT"; else print c}' /etc/shadow
'''
expect_stdout = '^HASH$'
