# PORT of ow-fw-12-invalid-log-limit-rolls-back. Changed: lab-r1 -> pulsar, r1_wan_ip -> p_wan_ip, regression list -> pulsar's default list (pulsar checks come from the local config); no other change.
name = "p-ow-fw-12-invalid-log-limit-rolls-back"
description = "setting the wan zone log limit to an invalid rate makes fw4 check fail. Newton must not confirm the change; after rollback the wan zone is present in the live ruleset and the invalid log_limit is absent from UCI."
target = "pulsar"
reset = ["pulsar"]
setup = ["portfwd_on"]
expect = "rolled_back"
timeout = 60
regression = "default"
approval = true
batch = '''
set firewall.{fw_wan_zone}.log='1'
set firewall.{fw_wan_zone}.log_limit='bogus/second'
'''

[[post]]
device = "pulsar"
cmd = '''
nft list ruleset | grep -q 'chain input_wan' && echo 'wan zone present in live ruleset'
'''
expect_stdout = '^wan zone present in live ruleset$'

[[post]]
device = "pulsar"
cmd = '''
[ -z "$(uci -q get firewall.{fw_wan_zone}.log_limit)" ] && echo 'wan log_limit unset'
'''
expect_stdout = '^wan log_limit unset$'
