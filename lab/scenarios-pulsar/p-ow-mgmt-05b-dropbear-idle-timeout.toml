# PORT of ow-mgmt-05b. Changed: lab-r1 -> pulsar; local ssh goes direct to 192.168.1.1 with the admin key and pulsar known_hosts (no proxy); regression -> pulsar's list.
name = "p-ow-mgmt-05b-dropbear-idle-timeout"
description = "OW-MGMT-05 variant, behavioural: IdleTimeout='20'. Effect: an ssh session that runs 'sleep 40' with no keepalives and no traffic is closed by the router after about 20 s (before the change it runs the full 40 s and prints 'done'). The probe fails unless the session really started, did not finish, ended with ssh's connection-lost status 255 (not the local timeout's 124), and ended between 12 and 32 s, so a refused connection or a client-side timeout cannot pass it. The second effect is the command-line proof (-I 20)."
target = "pulsar"
reset = ["pulsar"]
expect = "confirmed"
setup = ["portfwd_on"]
regression = "default"
approval = true
probes = [["proc-args", "dropbear", "-I 20"]]
batch = '''
set dropbear.@dropbear[0].IdleTimeout='20'
'''

[[effect]]
device = "local"
timeout = 90
cmd = '''
t0=$(date +%s)
out=$(timeout 60 ssh -i {pulsar_admin_key} -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=8 -o ServerAliveInterval=0 -o TCPKeepAlive=no -o UserKnownHostsFile={pulsar_known_hosts} -o StrictHostKeyChecking=yes root@192.168.1.1 'echo started; sleep 40; echo done' 2>&1); rc=$?
t1=$(date +%s); s=$((t1 - t0))
case "$out" in *started*) ;; *) echo "session never started after $s seconds: $out"; exit 1;; esac
case "$out" in *done*) echo "idle session survived the full $s seconds"; exit 1;; esac
[ "$rc" -eq 255 ] || { echo "session ended after $s seconds with ssh exit $rc, not 255 (connection lost): $out"; exit 1; }
[ "$s" -ge 12 ] && [ "$s" -le 32 ] || { echo "session closed after $s seconds, outside 12..32"; exit 1; }
echo "idle session closed by the router after $s seconds"
'''
expect_stdout = '^idle session closed by the router after [0-9]+ seconds$'

[[effect]]
device = "pulsar"
cmd = '''
tr '\0' ' ' < /proc/$(cat /var/run/dropbear.main.pid)/cmdline | grep -- ' -I 20 '
'''
