# OW-WIFI-01, WPA3-SAE only, on Pulsar's radio1 (5 GHz ch36 HE20, country US, txpower 3 dBm).
# The proof comes from lab-wifi (VM 9107), where the Panda MT7921AU passed through from apollo is the client and
# the monitor: a beacon parse of the pinned BSSID ({p_wifi_bssid}, radio1's own MAC read from the router at run
# time) and two real associations. The batch is self-contained: network wlan (static 192.168.152.1/24, no device,
# the wireless interface brings the interface up), dhcp wlan, firewall zone wlz (input/output/forward ACCEPT, the
# one lab zone that may let the lab client reach the internet) and the forwarding wlz -> wan. The existing
# wireless.default_radio1 section is edited, never created: it is in the baseline with disabled '1'.
# The key is the secret var {wifi_psk}: it reaches the batch only, and Pulsar's copy in /etc/config/wireless is
# in clear by nature (the runner's posts never print it).
name = "p-ow-wifi-01-sae"
description = "OW-WIFI-01: WPA3 only. Interface wlan on radio1 (5 GHz, ch36, HE20, country US, txpower 3 dBm), dhcp section wlan (pool .100, 50 leases, 1h), zone wlz (input/output/forward ACCEPT) with forwarding wlz to wan, and wireless.default_radio1 edited to disabled 0, ssid newton-test, network wlan, encryption sae, ieee80211w 2, with the key from the secret var. Effects, all from the Panda on lab-wifi, with --bssid pinned to radio1's MAC and the channel pinned to 5180 MHz: the monitor parses the beacons of that BSSID and the AKM suite set is exactly {SAE 00-0f-ac:8} with MFPC=1 and MFPR=1 (mandatory protected frames, so a WPA2-only client cannot associate at all), at least five of them, and no WPS vendor IE; a SAE client reaches wpa_state COMPLETED, takes a 192.168.152.0/24 lease by DHCP and pings 192.168.152.1. A post then runs the same key as a WPA2-PSK client with ieee80211w 0 and requires it NOT to reach COMPLETED in 25 s; that one is a post and not a third effect because an effect has to fail before the change and pass after it, which this assertion cannot do. The router side is one probe (iface-field wlan up true); the regression is Pulsar's baseline list. approval = true because the batch touches firewall."
target = "pulsar"
reset = ["pulsar"]
reset_after = ["pulsar"]
after_reset = ["p_radios_off"]
approval = true
expect = "confirmed"
timeout = 240
setup = ["wifi_script_install", "wifi_key_install", "wifi_prep"]
cleanup = ["wifi_cleanup"]
regression = ["mgmt_ssh", "mgmt_ssh_pw", "mgmt_ssh_newton", "mgmt_luci", "p_internet", "p_dns", "p_dhcp_listen", "p_client_on_pulsar"]
probes = [["iface-field", "wlan", "up", "true"], ["uci-equals", "wireless.default_radio1.disabled", "0"]]
batch = '''
set network.wlan=interface
set network.wlan.proto='static'
set network.wlan.ipaddr='192.168.152.1'
set network.wlan.netmask='255.255.255.0'
set dhcp.wlan=dhcp
set dhcp.wlan.interface='wlan'
set dhcp.wlan.start='100'
set dhcp.wlan.limit='50'
set dhcp.wlan.leasetime='1h'
set firewall.wlz=zone
set firewall.wlz.name='wlz'
set firewall.wlz.network='wlan'
set firewall.wlz.input='ACCEPT'
set firewall.wlz.output='ACCEPT'
set firewall.wlz.forward='ACCEPT'
set firewall.wlz_wan=forwarding
set firewall.wlz_wan.src='wlz'
set firewall.wlz_wan.dest='wan'
set wireless.radio1.country='US'
set wireless.radio1.channel='36'
set wireless.radio1.htmode='HE20'
set wireless.radio1.txpower='3'
set wireless.default_radio1.disabled='0'
set wireless.default_radio1.network='wlan'
set wireless.default_radio1.ssid='newton-test'
set wireless.default_radio1.encryption='sae'
set wireless.default_radio1.ieee80211w='2'
set wireless.default_radio1.key='{wifi_psk}'
'''

[[effect]]
device = "lab-wifi"
timeout = 60
cmd = "sudo /usr/local/bin/newton-wifi.py monitor --freq 5180 --bssid {p_wifi_bssid} --secs 20 --min-beacons 5 --expect-akm 8 --expect-mfpc 1 --expect-mfpr 1 --expect-no-wps"
expect_stdout = '^monitor: beacons=[1-9][0-9]* ssid=newton-test akm=8 mfpc=1 mfpr=1 wps=0 ciphers=ccmp '

[[effect]]
device = "lab-wifi"
timeout = 120
cmd = "sudo /usr/local/bin/newton-wifi.py client --mode sae --ssid newton-test --bssid {p_wifi_bssid} --freq 5180 --ieee80211w 2 --secs 40"
expect_stdout = '^client: state=COMPLETED ip=192\.168\.152\.[0-9]{1,3} ping=ok scan_ssid_seen=1$'

# The WPA2-only client is a post, not an effect: an effect must fail before the apply and pass after it, and this
# one passes both ways (before the change there is no AP at all to join, after it there is a WPA3-only one it must
# not join). The runner refuses an effect that already passes before the change ("already passes before apply; it
# cannot detect the change"), so an assertion of the form "this client must not associate" can only be a post, which
# runs after the change. That is where it belongs.
[[post]]
device = "lab-wifi"
timeout = 90
cmd = "sudo /usr/local/bin/newton-wifi.py client --mode psk --ssid newton-test --bssid {p_wifi_bssid} --freq 5180 --ieee80211w 0 --secs 25 --expect-fail"
expect_stdout = '^client: state=[A-Z_]+ expected-fail=ok$'
