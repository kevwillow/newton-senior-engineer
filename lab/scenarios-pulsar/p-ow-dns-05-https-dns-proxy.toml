# PORT of ow-dns-05-https-dns-proxy. Changed: lab-r1 -> pulsar; 192.168.150.1 -> 192.168.1.1; 10.109.0.50 -> {agent_ip}; the package's shipped force_dns_src_interface is already `lan` on Pulsar (one LAN, no `lab` zone), so drop the two force_dns_src_interface lines from the batch (keep resolver_url and bootstrap_dns); the lan zone is the one with chains dstnat_lan and forward_lan; the fw4 rules exist before the apply on Pulsar, so the fw effect becomes a post: dstnat_lan has 2 redirects to :53 and forward_lan 2 rejects of 853 tagged ubus:https-dns-proxy; the lab-client 1.1.1.1 effect and breaks = ["client_dot"] both need client traffic routed through the router (the agent host's traffic does NOT go through Pulsar), so drop them; regression -> pulsar's default list (no client_ext_dns). The "outside Newton's rollback" wording now says pulsar removes it.
name = "p-ow-dns-05-https-dns-proxy"
description = "OW-DNS-05 with the package it needs. The setup step https_dns_proxy_install installs https-dns-proxy with apk, outside Newton's rollback; the next reset of pulsar removes it (the runner's package restore: apk del of every world entry added since the record), and the package starts itself with its shipped defaults: two DoH instances (Cloudflare on 127.0.0.1:5053, Google on :5054), dnsmasq switched to them (the init script sets noresolv=1 and adds the two server lines, the iCloud and Mozilla canary names and its doh_* bookkeeping to /etc/config/dhcp, commits it and restarts dnsmasq) and fw4 rules for the interface `lan`, which is the only LAN on pulsar and is named `lan`. The batch is what a profile would send through Newton: instance 0 gets Quad9 as its resolver (resolver_url, bootstrap_dns). The plan holds only https-dns-proxy lines; the init script rewrites dhcp and the firewall by itself afterwards. The first effect checks the package's running proxies (Quad9 on 5053, no Cloudflare). Posts, which is the rest: fw4 redirects tcp/udp 53 from the lan zone to the router's dnsmasq and rejects tcp/udp 853 in forward_lan, both tagged ubus:https-dns-proxy (on Pulsar the rules already exist before the apply, so this is a post and not an effect); then four posts with the lab version's wording, one of which no longer asserts the same thing: forwarded name resolution through the DoH proxies, no-resolv, an established tcp 443 connection from the proxy to a Quad9 address, and the dhcp edits from the init script. The forward post is the changed one: pulsar's upstream is not lab-isp (10.100.0.1, 10.101.0.1), so it cannot assert that nothing was forwarded to those two addresses; it requires total forwards of the probe name == forwards to 127.0.0.1#5053/#5054 instead. Regression: pulsar's default list (no client_ext_dns; the agent host's traffic does not go through Pulsar, so client_ext_dns and client_dot are not part of the pulsar default). The package, its dhcp edits and its firewall rules stay in place until the next reset."
target = "pulsar"
reset = ["pulsar"]
expect = "confirmed"
setup = ["portfwd_on", "https_dns_proxy_install", "dns_logqueries_on"]
regression = ["mgmt_ssh", "mgmt_ssh_pw", "mgmt_ssh_newton", "mgmt_luci", "p_internet", "p_dns", "p_dhcp_listen", "portfwd"]
probes = [["proc-args", "https-dns-proxy", "-p 5053", "-r https://dns.quad9.net/dns-query"], ["nft-rule", "inet", "fw4", "dstnat_lan", "present", "ubus:https-dns-proxy"], ["nft-rule", "inet", "fw4", "forward_lan", "present", "ubus:https-dns-proxy"]]
batch = '''
set https-dns-proxy.@https-dns-proxy[0].resolver_url='https://dns.quad9.net/dns-query'
set https-dns-proxy.@https-dns-proxy[0].bootstrap_dns='9.9.9.9,149.112.112.112'
'''

[[effect]]
device = "pulsar"
cmd = '''
q=$(ps w | grep -c '[h]ttps-dns-proxy -r https://dns.quad9.net/dns-query -p 5053 '); c=$(ps w | grep -c '[h]ttps-dns-proxy -r https://cloudflare-dns.com/dns-query')
echo "https-dns-proxy processes: quad9 on 5053=$q cloudflare=$c"; [ "$q" = 1 ] && [ "$c" = 0 ]
'''
expect_stdout = '^https-dns-proxy processes: quad9 on 5053=1 cloudflare=0$'

[[post]]
device = "pulsar"
cmd = '''
rl=$(nft list chain inet fw4 dstnat_lan 2>/dev/null | grep -c 'redirect to :53.*ubus:https-dns-proxy')
fl=$(nft list chain inet fw4 forward_lan 2>/dev/null | grep -c 'dport 853 .*jump handle_reject.*ubus:https-dns-proxy')
echo "lan zone: redirects to :53=$rl rejects of 853=$fl"; [ "$rl" = 2 ] && [ "$fl" = 2 ]
'''
expect_stdout = '^lan zone: redirects to :53=2 rejects of 853=2$'

[[post]]
device = "local"
timeout = 45
cmd = "host -W 8 -t A newton-doh-probe.example.com 192.168.1.1 | tail -1"
expect_stdout = '^(newton-doh-probe\.example\.com (has no A record|has address \S+)|Host newton-doh-probe\.example\.com not found: 3\(NXDOMAIN\))$'

[[post]]
device = "pulsar"
cmd = '''
l=$(logread)
d=$(echo "$l" | grep -c 'forwarded newton-doh-probe\.example\.com to 127\.0\.0\.1#505[34]'); p=$(echo "$l" | grep -c 'forwarded newton-doh-probe\.example\.com to ')
n=$(grep -c '^no-resolv$' /var/etc/dnsmasq.conf.*)
echo "newton-doh-probe.example.com forwarded to the DoH proxies=$d, total forwards=$p; no-resolv lines=$n"; [ "$d" -ge 1 ] && [ "$p" = "$d" ] && [ "$n" = 1 ]
'''
expect_stdout = '^newton-doh-probe\.example\.com forwarded to the DoH proxies=[1-9]\d*, total forwards=\d+; no-resolv lines=1$'

[[post]]
device = "pulsar"
timeout = 40
cmd = '''
i=0
while [ $i -lt 15 ]; do
  pid=$(ps w | sed -n 's#^ *\([0-9][0-9]*\) .*[h]ttps-dns-proxy -r https://dns.quad9.net/dns-query -p 5053 .*#\1#p' | head -1)
  peer=$(netstat -tnp 2>/dev/null | awk -v p="$pid/" '$7 ~ "^" p && $6 == "ESTABLISHED" {split($5, a, ":"); print a[1] ":" a[2]}' | head -1)
  case "$peer" in 9.9.9.*:443|149.112.112.*:443) echo "quad9 proxy (pid $pid) holds an established connection to $peer"; exit 0;; esac
  sleep 1; i=$((i+1))
done
echo "no established tcp 443 connection from the quad9 proxy to a Quad9 address (pid [$pid], peer [$peer])"; exit 1
'''
expect_stdout = '^quad9 proxy \(pid \d+\) holds an established connection to (9\.9\.9|149\.112\.112)\.\d+:443$'

[[post]]
device = "pulsar"
cmd = '''
echo "dhcp: noresolv=$(uci -q get dhcp.@dnsmasq[0].noresolv) servers=[$(uci -q get dhcp.@dnsmasq[0].server | tr ' ' ',')] doh_server=[$(uci -q get dhcp.@dnsmasq[0].doh_server | tr ' ' ',')]"
'''
expect_stdout = "^dhcp: noresolv=1 servers=\\[[^]]*127\\.0\\.0\\.1#5053[^]]*127\\.0\\.0\\.1#5054[^]]*\\] doh_server=\\[127\\.0\\.0\\.1#5053,127\\.0\\.0\\.1#5054\\]$"
