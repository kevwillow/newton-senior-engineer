platform = "routeros"

[[getter]]
id = "version"
command = "/system resource print"
why = "Shows RouterOS version, uptime, board and resource usage."
expect = ["version: 6* || version: 7*", "uptime: *"]
enabled = true
verified = "lab:chr:7.24.5:2026-10-18"
os_range = "7.24.5"
source = "https://help.mikrotik.com/docs/"
error_markers = ["bad command name", "expected end of command", "not enough permissions", "no such item"]

[[getter]]
id = "interfaces"
command = "/interface print"
why = "Lists interfaces with type, MTU and running state."
expect = ["Columns: NAME, || # NAME || * name=* || * * name=*"]
enabled = true
verified = "lab:chr:7.24.5:2026-10-18"
os_range = "7.24.5"
source = "https://help.mikrotik.com/docs/"
error_markers = ["bad command name", "expected end of command", "not enough permissions", "no such item"]

[[getter]]
id = "routes"
command = "/ip route print"
