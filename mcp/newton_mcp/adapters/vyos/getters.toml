platform = "vyos"

[[getter]]
id = "version"
command = "show version"
why = "Shows the VyOS version, build type and build details."
expect = ["Version: VyOS"]
enabled = true
verified = "lab:vyos:2026.10.01-0035-rolling:2026-10-18"
os_range = "2026.10.01-0035-rolling"
source = "https://docs.vyos.io/en/latest/"
error_markers = ["Invalid command", "Incomplete command", "Ambiguous command", "command not found"]

[[getter]]
id = "interfaces"
command = "show interfaces"
why = "Lists interfaces with address, link state and description in one table."
expect = ["Interface IP Address"]
enabled = true
verified = "lab:vyos:2026.10.01-0035-rolling:2026-10-18"
os_range = "2026.10.01-0035-rolling"
source = "https://docs.vyos.io/en/latest/"
error_markers = ["Invalid command", "Incomplete command", "Ambiguous command", "command not found"]

