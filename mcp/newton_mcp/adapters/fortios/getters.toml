platform = "fortios"

[[getter]]
id = "version"
command = "get system status"
why = "Shows the FortiOS version, build and signature database versions."
expect = ["Version: Forti*"]
enabled = false
verified = "unverified"
source = "https://docs.fortinet.com/product/fortigate"
error_markers = ["Command fail\\. Return code", "Unknown action", "command parse error", "(?m)^Permission denied"]

[[getter]]
id = "interfaces"
command = "get system interface physical"
why = "Lists the physical interfaces with status, speed and address."
expect = ["== [ * ]"]
enabled = false
verified = "unverified"
source = "https://docs.fortinet.com/product/fortigate"
error_markers = ["Command fail\\. Return code", "Unknown action", "command parse error", "(?m)^Permission denied"]

[[getter]]
id = "routes"
command = "get router info routing-table all"
why = "Shows the active IPv4 routing table of the current VDOM."
expect = ["Codes: * - *"]
enabled = false
verified = "unverified"
source = "https://docs.fortinet.com/product/fortigate"
error_markers = ["Command fail\\. Return code", "Unknown action", "command parse error", "(?m)^Permission denied"]

