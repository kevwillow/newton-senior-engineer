# EOS intent -> revert-wrapped snippet mapping.
#
# Audit ids name the enabled getters of this platform
# (``mcp/newton_mcp/adapters/eos/getters.toml``); only ``version``,
# ``interfaces`` and ``routes`` are enabled today, so ``mgmt_services``,
# ``firewall_policy``, ``nat``, ``logging`` and ``ntp`` never appear in
# an ``audit`` list. Every snippet is UNVERIFIED until a lab run
# confirms it on cEOS-lab (none exists here yet).
#
# Keys of an [[intent]] entry, in this order:
#   id, explanation, doc, ledger, audit, check, good, snippet, confirm.
# Reserved keys refused by the loader: control_id, tier, form_of.
# Only the four service-off intents may carry ``snippet`` / ``confirm``.
#
# Intents not listed here are returned by ``recommend()`` with
# guidance "none" and explanation "no guidance for <platform> yet".
[[intent]]
id = 'INT-MGMT-SRC'
explanation = 'Decide which source prefixes may reach the admin plane on the EOS instance; store the chosen prefix list per device.'
doc = 'profiles/eos/notes.md'
ledger = ''
audit = []
check = 'Confirm the chosen source restriction is applied at the admin boundary before any user accounts are reachable from outside it.'
good = 'Admin reachability on every enabled service is constrained to the recorded source set; nothing else responds.'

[[intent]]
id = 'INT-MGMT-NO-TELNET'
explanation = 'No snippet is shipped for telnet on EOS; the platform does not expose a global telnet service in the role Newton uses, so there is nothing for the wrapper to disable.'
doc = 'profiles/eos/notes.md'
ledger = ''
audit = []
check = 'Check the running configuration on the device console for telnet listeners; no enabled getter shows it yet.'
good = 'No telnet listener answers on the admin plane; the device accepts only ssh for admin access.'

[[intent]]
id = 'INT-MGMT-NO-WEB'
explanation = 'Disable the EOS HTTPS web UI; admin traffic stays on the CLI.'
doc = 'profiles/eos/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for the presence of ``management https``; expect none after the snippet runs.'
good = 'The HTTPS web UI is absent from the active configuration; only ssh listens on the admin plane.'
snippet = """\
configure session newton-web
no management https
commit timer 00:10:00"""
confirm = 'Run ``configure session newton-web commit`` within 10 minutes; otherwise the device rolls the change back to the prior configuration.'

[[intent]]
id = 'INT-MGMT-NO-API'
explanation = 'Disable the EOS HTTP API (eAPI); admin automation must use ssh.'
doc = 'profiles/eos/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for the presence of a ``management api http-commands`` stanza; expect none after the change.'
good = 'The eAPI subtree is absent from the active configuration; the device accepts only ssh on the admin plane.'
snippet = """\
configure session newton-api
no management api http-commands
commit timer 00:10:00"""
confirm = 'Run ``configure session newton-api commit`` within 10 minutes; otherwise the device rolls the change back to the prior configuration.'

[[intent]]
id = 'INT-SNMP-V3-ONLY'
explanation = 'When SNMP is needed, run it on v3 with auth + priv; never advertise a community string.'
doc = 'profiles/eos/notes.md'
ledger = ''
audit = []
check = 'If SNMP is required, audit the running snmp stanza for v3-only mode with auth and priv; community lines must be absent.'
good = 'SNMP, when present, responds to v3 requests with auth+priv only; no v1/v2 community line remains.'

[[intent]]
id = 'INT-SNMP-OFF'
explanation = 'Turn EOS SNMP off entirely; no v3 listener, no community, no traps.'
doc = 'profiles/eos/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for the presence of a ``snmp-server`` stanza; expect none after the snippet runs.'
good = 'The snmp-server stanza is absent from the active configuration; the device ignores UDP/161 probes.'
snippet = """\
configure session newton-snmp
no snmp-server
commit timer 00:10:00"""
confirm = 'Run ``configure session newton-snmp commit`` within 10 minutes; otherwise the device rolls the change back to the prior configuration.'

[[intent]]
id = 'INT-SSH-KEYS-ONLY'
explanation = 'Disable SSH password login after a key login is proven on the EOS account.'
doc = 'profiles/eos/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for ``username <name> privilege <n>`` entries without a ``sshkey`` line and the absence of ``aaa authentication login`` defaults that allow password.'
good = 'Every login user authenticates only with a key; passwords are not accepted on ssh.'

[[intent]]
id = 'INT-INBOUND-NONE'
explanation = 'No inbound services; firewall and NAT rules should not accept anything from outside the WAN.'
doc = 'profiles/eos/notes.md'
ledger = ''
audit = []
check = 'No enabled getter covers firewall or NAT on this platform yet; the audit list is empty until a lab-verified getter ships.'
good = 'firewall and NAT hold no inbound accept; nothing from outside reaches a LAN port.'

[[intent]]
id = 'INT-LOG-REMOTE'
explanation = 'Forward EOS logs to a syslog server; the device keeps an on-box log too.'
doc = 'profiles/eos/notes.md'
ledger = ''
audit = []
check = 'No enabled getter covers logging on this platform yet; the audit list is empty until a lab-verified getter ships.'
good = 'logs reach the configured syslog endpoint; the on-box log reflects the same events.'

[[intent]]
id = 'INT-NTP-SERVERS'
explanation = 'List the NTP servers EOS syncs against; the device clock must be right for every auth check.'
doc = 'profiles/eos/notes.md'
ledger = ''
audit = []
check = 'No enabled getter covers NTP on this platform yet; the audit list is empty until a lab-verified getter ships.'
good = 'At least one configured NTP server is reachable and the device reports its clock as synchronised.'
