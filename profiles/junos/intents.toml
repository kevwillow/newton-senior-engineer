# Junos intent -> revert-wrapped snippet mapping.
#
# Audit ids name the enabled getters of this platform
# (``mcp/newton_mcp/adapters/junos/getters.toml``); only ``version``,
# ``interfaces`` and ``routes`` are enabled today, so ``mgmt_services``,
# ``firewall_policy``, ``nat``, ``logging`` and ``ntp`` never appear in
# an ``audit`` list (the wall against writes is the role, not the
# getter allowlist, but only those three getters have shipped so far).
# Every snippet is UNVERIFIED until a lab run confirms it on a
# vJunos lab. The change path is tested on a vJunos image; these
# intent snippets are not.
#
# Keys of an [[intent]] entry, in this order:
#   id, explanation, doc, ledger, audit, check, good, snippet, confirm.
# Reserved keys refused by the loader: control_id, tier, form_of.
# Only the four service-off intents may carry ``snippet`` / ``confirm``.
#
# Intents not listed here are returned by ``recommend()`` with
# guidance "none" and explanation "no guidance for <platform> yet".
[[intent]]
id = 'INT-MGMT-SRC'
explanation = 'Decide which source prefixes may reach the admin plane on the Junos instance; store the chosen prefix list per device.'
doc = 'profiles/junos/notes.md'
ledger = ''
audit = []
check = 'Confirm the chosen source restriction is applied at the admin boundary before any user accounts are reachable from outside it.'
good = 'Admin reachability on every enabled service is constrained to the recorded source set; nothing else responds.'

[[intent]]
id = 'INT-MGMT-NO-TELNET'
explanation = 'Disable Junos telnet; only ssh reaches the admin plane.'
doc = 'profiles/junos/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for the presence of ``system services telnet``; expect none after the snippet runs.'
good = 'The telnet service is absent from the active configuration; only ssh listens on the admin plane.'
snippet = """\
configure
delete system services telnet
commit confirmed 10"""
confirm = 'Run ``commit`` within 10 minutes; otherwise the device rolls the change back to the prior configuration.'

[[intent]]
id = 'INT-MGMT-NO-WEB'
explanation = 'Disable the Junos web-management subtree so admin traffic stays on the CLI; both plain HTTP and HTTPS UI are removed.'
doc = 'profiles/junos/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for the presence of ``system services web-management``; expect the whole subtree gone after the change.'
good = 'The ``system services web-management`` subtree is absent from the active configuration; only ssh listens on the admin plane.'
snippet = """\
configure
delete system services web-management
commit confirmed 10"""
confirm = 'Run ``commit`` within 10 minutes; otherwise the device rolls the change back to the prior configuration.'

[[intent]]
id = 'INT-MGMT-NO-API'
explanation = 'Disable the Junos REST API subtree; admin automation must use ssh.'
doc = 'profiles/junos/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for the presence of a ``system services rest`` stanza; expect none after the change.'
good = 'The REST API subtree is absent from the active configuration; the device accepts only ssh on the admin plane.'
snippet = """\
configure
delete system services rest
commit confirmed 10"""
confirm = 'Run ``commit`` within 10 minutes; otherwise the device rolls the change back to the prior configuration.'

[[intent]]
id = 'INT-SNMP-V3-ONLY'
explanation = 'When SNMP is needed, run it on v3 with auth + priv; never advertise a community.'
doc = 'profiles/junos/notes.md'
ledger = ''
audit = []
check = 'If SNMP is required, audit the running snmp stanza for v3-only mode with auth and priv; community lines must be absent.'
good = 'SNMP, when present, responds to v3 requests with auth+priv only; no v1/v2 community line remains.'

[[intent]]
id = 'INT-SNMP-OFF'
explanation = 'Turn Junos SNMP off entirely; no v3 listener, no community, no traps.'
doc = 'profiles/junos/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for the presence of a top-level ``snmp`` stanza; expect none after the snippet runs.'
good = 'The snmp stanza is absent from the active configuration; the device ignores UDP/161 probes.'
snippet = """\
configure
delete snmp
commit confirmed 10"""
confirm = 'Run ``commit`` within 10 minutes; otherwise the device rolls the change back to the prior configuration.'

[[intent]]
id = 'INT-SSH-KEYS-ONLY'
explanation = 'Disable SSH password login after a key login is proven on the Junos account.'
doc = 'profiles/junos/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for ``system login user <name> authentication ssh-ed25519`` on every admin account and the absence of any password hash.'
good = 'Every login user authenticates only with a key; passwords are not accepted on ssh.'

[[intent]]
id = 'INT-INBOUND-NONE'
explanation = 'No inbound services; firewall and NAT rules should not accept anything from outside the WAN.'
doc = 'profiles/junos/notes.md'
ledger = ''
audit = []
check = 'No enabled getter covers firewall or NAT on this platform yet; the audit list is empty until a lab-verified getter ships.'
good = 'firewall and NAT hold no inbound accept; nothing from outside reaches a LAN port.'

[[intent]]
id = 'INT-LOG-REMOTE'
explanation = 'Forward Junos logs to a syslog server; the device keeps an on-box log too.'
doc = 'profiles/junos/notes.md'
ledger = ''
audit = []
check = 'No enabled getter covers logging on this platform yet; the audit list is empty until a lab-verified getter ships.'
good = 'logs reach the configured syslog endpoint; the on-box log reflects the same events.'

[[intent]]
id = 'INT-NTP-SERVERS'
explanation = 'List the NTP servers Junos syncs against; the device clock must be right for every auth check.'
doc = 'profiles/junos/notes.md'
ledger = ''
audit = []
check = 'No enabled getter covers NTP on this platform yet; the audit list is empty until a lab-verified getter ships.'
good = 'At least one configured NTP server is reachable and the device reports its clock as synchronised.'
