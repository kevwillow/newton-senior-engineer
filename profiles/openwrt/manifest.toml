[[control]]
id = 'OW-V6-01'
tier = 'standard'
title = 'IPv6 firewall parity'
lab = 'audit'
scenario = 'ow-v6-01-wan6-in-wan-zone.toml'
step_up_of = ''
form_of = ''
preconditions = []
batch = []
check = '''
ch=$(nft list chain inet fw4 input_wan 2>/dev/null) || { echo "no chain input_wan in table inet fw4"; exit 1; }
v6=$(echo "$ch" | grep -c -e 'icmpv6' -e 'nfproto ipv6')
v4=$(echo "$ch" | grep -c -e 'nfproto ipv4' -e 'icmp type' -e 'igmp')
last=$(echo "$ch" | awk '/^\t\t/ {l=$0} END {sub(/^[[:space:]]+/, "", l); print l}')
hook=$(nft list chain inet fw4 input | grep 'jump input_wan' | sed 's/^[[:space:]]*//')
echo "input_wan: ipv6-specific rules=$v6, ipv4-specific rules=$v4; final rule: $last; hook: $hook"
case "$last" in "jump reject_from_wan"|"jump drop_from_wan") :;; *) exit 1;; esac
[ "$v6" -ge 1 ] && case "$hook" in *"IPv4/IPv6"*) exit 0;; esac
exit 1'''
expect = '^input_wan: ipv6-specific rules=[1-9]\d*, ipv4-specific rules=\d+; final rule: jump (reject|drop)_from_wan; hook: iifname .* jump input_wan comment "!fw4: Handle wan IPv4/IPv6 input traffic"$'
check_host = 'router'
check_from = 'post:1'
check_kind = 'live'
lab_bound = []
notes = 'Audit only: the lab test reads the router and changes nothing. The lab has no IPv6 upstream, so nothing was tested on the wire.'

