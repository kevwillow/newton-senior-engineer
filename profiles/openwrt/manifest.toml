# OpenWrt profile manifest. Generated from the profile research
# (not published) and lab/scenarios/openwrt/*.toml. Scenario-derived check and expect text follows
# check_from byte for byte (apart from a trailing newline); do not edit it by hand.
#
# Keys of a [[control]] entry, in this order:
#   id            control ID, e.g. OW-FW-01
#   tier          standard | hardened | lockdown | opt-in | none
#   title         catalogue title; a step-up or opt-in form adds it in parentheses
#   lab           proven | audit | caveat | not-yet   (the tier doc's Lab column)
#   scenario      file name in lab/scenarios/openwrt/, or "" when there is none
#   step_up_of    tier of the base entry this stronger form belongs to, or ""
#   form_of       tier of the base entry this alternative form belongs to, or ""
#   preconditions plain strings: packages, listeners or clock state needed first
#   batch         the uci staging lines, exactly as in the scenario; [] for
#                 audit-only and not-yet controls
#   check         read-only command that proves the control is live (taken from
#                 one effect or post of the scenario), or ""
#   expect        regex the check's stdout must match, or ""
#   check_host    router | lab | ""    (lab: the check runs on a lab host)
#   check_from    effect:N | post:N | derived | ""; source of check/expect;
#                 derived means the check is built from more than one step;
#                 notes must contain "Derived check:" and say how; check.py cannot
#                 compare a derived check with the scenario, so
#                 tests/profiles/test_profiles_live_checks.py runs it offline
#   check_kind    live | config | ""; whether check reads runtime or UCI only
#   lab_bound     batch/check parts tied to lab-r1 names, addresses or devices
#   notes         the tier doc's Notes column, shortened, plus placeholder and
#                 lab-bound remarks
#
# Every key is a string except preconditions, batch and lab_bound, which are
# lists of strings; check.py reports any other type as a problem line.
#
# Placeholders {fw_wan_zone}, {fw_allow_ping}, {client_lab_ip} and {lan_device}
# are resolved at apply time; {lan_device} stands in for the lab's physical
# eth3 in the zone and IPv6-off batches, because profiles must not hard-code
# physical device names.
#
# (id, tier) is unique; step_up_of / form_of entries are not counted again.
[[control]]
id = 'OW-MGMT-01'
tier = 'standard'
title = 'SSH on LAN only'
lab = 'caveat'
scenario = 'ow-mgmt-01-dropbear-interface.toml'
step_up_of = ''
form_of = ''
preconditions = []
batch = [
  "set dropbear.@dropbear[0].Interface='lan'",
]
probes = [
  ["listen", "tcp", "wildcard", "22", "dropbear", "absent"],
  ["listen", "tcp", "any", "22", "dropbear", "present"],
]
check = '''
netstat -tlnp | awk '$4=="10.109.0.11:22" && $7 ~ /dropbear/ {m=1} $4=="0.0.0.0:22"||$4==":::22"{w=1} END{print "mgmt-listener=" m+0 " wildcard-listener=" w+0; exit !(m&&!w)}'
'''
expect = '^mgmt-listener=1 wildcard-listener=0$'
check_host = 'router'
check_from = 'effect:0'
check_kind = 'live'
lab_bound = ['check']
notes = '''proven; `Interface` binds addresses and fails open; 01b `DirectInterface` binds the device. Standard/Hardened use `Interface`, Lockdown uses `DirectInterface`; it needs its own listener check. check is the lab's listener check (Interface fails open): it names lab-r1's mgmt address, so it passes on lab-r1 only; the expect is derived from the line the step prints.'''

[[control]]
id = 'OW-MGMT-02'
tier = 'standard'
title = 'LuCI/uhttpd on LAN only'
lab = 'proven'
scenario = 'ow-mgmt-02-uhttpd-listen-lan.toml'
step_up_of = ''
form_of = ''
preconditions = []
batch = [
  'delete uhttpd.main.listen_http',
  "add_list uhttpd.main.listen_http='10.109.0.11:80'",
  'delete uhttpd.main.listen_https',
  "add_list uhttpd.main.listen_https='10.109.0.11:443'",
]
check = '''
tcp() { LC_ALL=C timeout 6 bash -c "exec 3<>/dev/tcp/$1/$2" 2>&1; }
tcp 192.168.150.1 53 >/dev/null || { echo "router not reachable on 192.168.150.1:53"; exit 1; }
tcp 192.168.150.1 80 | grep -q 'Connection refused' && tcp 192.168.150.1 443 | grep -q 'Connection refused' && echo "192.168.150.1:80 and :443 refused, 192.168.150.1:53 open"
'''
expect = '^192\.168\.150\.1:80 and :443 refused'
check_host = 'lab'
check_from = 'effect:1'
check_kind = 'live'
lab_bound = ['batch', 'check']
notes = 'IPv6 access to LuCI goes away. check runs from a lab client and names the lab client LAN address (192.168.150.1).'

