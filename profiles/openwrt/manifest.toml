[[control]]
id = 'OW-ZONE-01'
tier = 'opt-in'
title = 'Guest network isolated'
lab = 'proven'
scenario = 'ow-zone-01-guest.toml'
step_up_of = ''
form_of = ''
preconditions = []
batch = [
  'set network.guest=interface',
  "set network.guest.proto='static'",
  "set network.guest.device='{lan_device}.30'",
  "set network.guest.ipaddr='192.168.30.1'",
  "set network.guest.netmask='255.255.255.0'",
  'set dhcp.guest=dhcp',
  "set dhcp.guest.interface='guest'",
  "set dhcp.guest.start='100'",
  "set dhcp.guest.limit='100'",
  "set dhcp.guest.leasetime='1h'",
  'set firewall.guest_zone=zone',
  "set firewall.guest_zone.name='guest'",
  "set firewall.guest_zone.network='guest'",
  "set firewall.guest_zone.input='REJECT'",
  "set firewall.guest_zone.output='ACCEPT'",
  "set firewall.guest_zone.forward='REJECT'",
  'set firewall.guest_wan=forwarding',
  "set firewall.guest_wan.src='guest'",
  "set firewall.guest_wan.dest='wan'",
  'set firewall.guest_dhcp=rule',
  "set firewall.guest_dhcp.name='Allow-Guest-DHCP'",
  "set firewall.guest_dhcp.src='guest'",
  "set firewall.guest_dhcp.proto='udp'",
  "set firewall.guest_dhcp.dest_port='67'",
  "set firewall.guest_dhcp.target='ACCEPT'",
  'set firewall.guest_dns=rule',
  "set firewall.guest_dns.name='Allow-Guest-DNS'",
  "set firewall.guest_dns.src='guest'",
  "set firewall.guest_dns.proto='tcp udp'",
  "set firewall.guest_dns.dest_port='53'",
  "set firewall.guest_dns.target='ACCEPT'",
]
check = '''
sudo ip netns exec guest bash -c '
tcp() { LC_ALL=C timeout 6 bash -c "exec 3<>/dev/tcp/$1/$2" 2>&1; }
tcp 192.168.30.1 53 >/dev/null || { echo "control failed: no tcp connect from the guest netns to the allowed 192.168.30.1:53"; exit 1; }
bad=""
for t in 192.168.30.1:22 192.168.30.1:80 192.168.30.1:443 10.109.0.11:22 10.109.0.11:443 192.168.150.1:22 192.168.150.1:443 {client_lab_ip}:22; do
  tcp ${t%:*} ${t#*:} | grep -q "Connection refused" || bad="$bad $t"
done
[ -z "$bad" ] || { echo "not refused:$bad"; exit 1; }
echo "guest netns: 192.168.30.1:53 open; refused: router 22/80/443 on 192.168.30.1, 22/443 on 10.109.0.11 and 192.168.150.1, and ssh on the client LAN host"
'
'''
expect = '^guest netns: 192\.168\.30\.1:53 open; refused: '
check_host = 'lab'
check_from = 'post:0'
check_kind = 'live'
lab_bound = ['check']
notes = "Offered at Standard. Adds a new network with its own subnet and DHCP. It is an extra, not a Standard control. batch uses {lan_device} in place of the lab's eth3. check runs in the lab's guest namespace and names lab addresses."

[[control]]
id = 'OW-DNS-04'
tier = 'opt-in'
title = 'DNSSEC validation'
lab = 'caveat'
scenario = 'ow-dns-04b-dnssec-full.toml'
step_up_of = ''
form_of = ''
preconditions = [
  'package dnsmasq-full',
  'router clock correct (NTP synced)',
]
batch = [
  "set dhcp.@dnsmasq[0].dnssec='1'",
]
probes = [
  ["conf-has", "dnsmasq", "line", "present", "dnssec"],
  ["conf-has", "dnsmasq", "substr", "present", "trust-anchors.conf"],
  ["log-has", "min:1", "DNSSEC validation enabled"],
]
check = '''
f=$(cat /var/etc/dnsmasq.conf.*)
a=$(echo "$f" | grep -c '^dnssec$'); b=$(echo "$f" | grep -c '^conf-file=/usr/share/dnsmasq/trust-anchors.conf$')
c=$(logread | grep 'dnsmasq\[' | grep -c 'DNSSEC validation enabled')
echo "running dnsmasq conf: dnssec=$a trust-anchors=$b; startup log lines 'DNSSEC validation enabled'=$c"; [ "$a" = 1 ] && [ "$b" = 1 ] && [ "$c" -ge 1 ]
'''
expect = '^running dnsmasq conf: dnssec=1 trust-anchors=1; startup log lines .DNSSEC validation enabled.=[1-9]\d*$'
check_host = 'router'
check_from = 'effect:0'
check_kind = 'live'
lab_bound = []
notes = "Offered at Hardened. Opt-in, never applied by default. Needs `dnsmasq-full`; on the stock build `dnssec='1'` leaves no DNS or DHCP after the next restart, so it needs a live check first."

[[control]]
id = 'OW-DNS-05'
tier = 'opt-in'
title = 'Encrypted upstream (DoH)'
lab = 'caveat'
scenario = 'ow-dns-05-https-dns-proxy.toml'
step_up_of = ''
form_of = ''
preconditions = [
  'package https-dns-proxy',
]
batch = [
  "set https-dns-proxy.@https-dns-proxy[0].resolver_url='https://dns.quad9.net/dns-query'",
  "set https-dns-proxy.@https-dns-proxy[0].bootstrap_dns='9.9.9.9,149.112.112.112'",
  'delete https-dns-proxy.config.force_dns_src_interface',
  "add_list https-dns-proxy.config.force_dns_src_interface='lab'",
]
probes = [
  ["uci-equals", "https-dns-proxy.@https-dns-proxy[0].resolver_url", "https://dns.quad9.net/dns-query"],
  ["uci-equals", "https-dns-proxy.@https-dns-proxy[0].bootstrap_dns", "9.9.9.9,149.112.112.112"],
  ["proc-args", "https-dns-proxy", "-r https://dns.quad9.net/dns-query"],
]
check = '''
q=$(ps w | grep -c '[h]ttps-dns-proxy -r https://dns.quad9.net/dns-query -p 5053 '); c=$(ps w | grep -c '[h]ttps-dns-proxy -r https://cloudflare-dns.com/dns-query')
echo "https-dns-proxy processes: quad9 on 5053=$q cloudflare=$c"; [ "$q" = 1 ] && [ "$c" = 0 ]
'''
expect = '^https-dns-proxy processes: quad9 on 5053=1 cloudflare=0$'
check_host = 'router'
check_from = 'effect:0'
check_kind = 'live'
lab_bound = ['batch']
notes = "In no tier (the Tier cell says H). https-dns-proxy edits dhcp and fw4 outside Newton's rollback, and its dhcp backup is not idempotent; see the tier doc's DoH warning."

[[control]]
id = 'OW-UPD-02'
