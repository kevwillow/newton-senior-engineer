[[control]]
id = 'OW-NTP-01'
tier = 'standard'
title = 'Local NTP, restricted'
lab = 'proven'
scenario = 'ow-ntp-01-local-server.toml'
step_up_of = ''
form_of = ''
preconditions = []
batch = [
  "set system.ntp.use_dhcp='0'",
  "set system.ntp.enable_server='1'",
  "set system.ntp.interface='lab'",
  'delete system.ntp.server',
  "add_list system.ntp.server='time.cloudflare.com'",
  "add_list system.ntp.server='time.google.com'",
  "add_list system.ntp.server='pool.ntp.org'",
]
probes = [
  ["uci-equals", "system.ntp.use_dhcp", "0"],
  ["uci-equals", "system.ntp.enable_server", "1"],
  ["proc-args", "ntpd", "-p time.cloudflare.com"],
  ["proc-args", "ntpd", "!~openwrt.pool.ntp.org"],
]
check = '''
d=$(ifstatus lab | jsonfilter -e '@.device'); [ -n "$d" ] || { echo "no device for interface lab"; exit 1; }
for p in $(pidof ntpd); do
  c=" $(tr '\0' ' ' < /proc/$p/cmdline)"
  case "$c" in " /usr/sbin/ntpd "*) :;; *) continue;; esac
  ok=1
  for t in " -l " " -I $d " " -p time.cloudflare.com " " -p time.google.com " " -p pool.ntp.org "; do
    case "$c" in *"$t"*) :;; *) ok=0;; esac
  done
  case "$c" in *"openwrt.pool.ntp.org"*) ok=0;; esac
  l=$(netstat -ulpn | grep -c ':123 .*ntpd')
  echo "ntpd:$c| listener udp :123 lines=$l"
  [ $ok = 1 ] && [ "$l" -ge 1 ] && exit 0
  exit 1
done
echo "no ntpd process"; exit 1'''
expect = '^ntpd: /usr/sbin/ntpd -n -N -l -I eth3 -S /usr/sbin/ntpd-hotplug -p time\.cloudflare\.com -p time\.google\.com -p pool\.ntp\.org \| listener udp :123 lines=[1-9]'
check_host = 'router'
check_from = 'effect:0'
check_kind = 'live'
lab_bound = ['batch', 'check']
notes = "check/expect pin the lab ntpd command line: the lab device eth3 and the lab's NTP servers."

