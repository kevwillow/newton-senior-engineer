# IOS XE intent -> revert-wrapped snippet mapping.
#
# Audit ids name the enabled getters of this platform
# (``mcp/newton_mcp/adapters/iosxe/getters.toml``); only ``version``,
# ``interfaces`` and ``routes`` are enabled today, so ``mgmt_services``,
# ``firewall_policy``, ``nat``, ``logging`` and ``ntp`` never appear in
# an ``audit`` list. Every snippet is UNVERIFIED until a lab run
# confirms it on a Cisco IOS XE lab (none exists here yet).
#
# Keys of an [[intent]] entry, in this order:
#   id, explanation, doc, ledger, audit, check, good, snippet, confirm.
# Reserved keys refused by the loader: control_id, tier, form_of.
# Only the four service-off intents may carry ``snippet`` / ``confirm``.
#
# Intents not listed here are returned by ``recommend()`` with
# guidance "none" and explanation "no guidance for <platform> yet".
[[intent]]
id = 'INT-MGMT-SRC'
explanation = 'Decide which source prefixes may reach the admin plane on the IOS XE instance; store the chosen prefix list per device.'
doc = 'profiles/iosxe/notes.md'
ledger = ''
audit = []
check = 'Confirm the chosen source restriction is applied at the admin boundary before any user accounts are reachable from outside it.'
good = 'Admin reachability on every enabled service is constrained to the recorded source set; nothing else responds.'

[[intent]]
id = 'INT-MGMT-NO-TELNET'
explanation = 'No snippet is shipped for telnet on IOS XE; the role Newton uses does not grant VTY write access, so the wrapper would have no body to run that the lab has proven.'
doc = 'profiles/iosxe/notes.md'
ledger = ''
audit = []
check = 'Check the running configuration on the device console for telnet line vty entries; no enabled getter shows it yet.'
good = 'No telnet listener answers on the admin plane; the device accepts only ssh for admin access.'

[[intent]]
id = 'INT-MGMT-NO-WEB'
explanation = 'Disable the IOS XE web servers; admin traffic stays on the CLI.'
doc = 'profiles/iosxe/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for the presence of ``ip http server`` and ``ip http secure-server``; expect none after the snippet runs.'
good = 'Neither the HTTP nor the HTTPS web server is in the active configuration; only ssh listens on the admin plane.'
snippet = """\
configure terminal revert timer 10
no ip http server
no ip http secure-server
end"""
confirm = 'Run ``configure confirm`` within 10 minutes; otherwise the device rolls the change back to the prior configuration.'

[[intent]]
id = 'INT-MGMT-NO-API'
explanation = 'No snippet is shipped for the API on IOS XE; the role Newton uses does not grant the writes required to disable RESTCONF or NETCONF, and the lab has not yet proven a safe single-statement body.'
doc = 'profiles/iosxe/notes.md'
ledger = ''
audit = []
check = 'Check the running configuration on the device console for RESTCONF or NETCONF listeners; no enabled getter shows it yet.'
good = 'No HTTP API listener answers on the admin plane; the device accepts only ssh for admin access.'

[[intent]]
id = 'INT-SNMP-V3-ONLY'
explanation = 'When SNMP is needed, run it on v3 with auth + priv; never advertise a community string.'
doc = 'profiles/iosxe/notes.md'
ledger = ''
audit = []
check = 'If SNMP is required, audit the running snmp stanza for v3-only mode with auth and priv; community lines must be absent.'
good = 'SNMP, when present, responds to v3 requests with auth+priv only; no v1/v2 community line remains.'

[[intent]]
id = 'INT-SNMP-OFF'
explanation = 'Turn IOS XE SNMP off entirely; no v3 listener, no community, no traps.'
doc = 'profiles/iosxe/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for the presence of an ``snmp-server`` stanza; expect none after the snippet runs.'
good = 'The snmp-server stanza is absent from the active configuration; the device ignores UDP/161 probes.'
snippet = """\
configure terminal revert timer 10
no snmp-server
end"""
confirm = 'Run ``configure confirm`` within 10 minutes; otherwise the device rolls the change back to the prior configuration.'

[[intent]]
id = 'INT-SSH-KEYS-ONLY'
explanation = 'Disable SSH password login after a key login is proven on the IOS XE account.'
doc = 'profiles/iosxe/notes.md'
ledger = ''
audit = []
check = 'Audit the running config for ``transport input ssh`` on every VTY and the absence of a ``username <name> secret`` line on any admin account.'
good = 'Every VTY accepts only ssh; every admin account authenticates with a key and never with a password.'

[[intent]]
id = 'INT-INBOUND-NONE'
explanation = 'No inbound services; ACL and NAT rules should not accept anything from outside the WAN.'
doc = 'profiles/iosxe/notes.md'
ledger = ''
audit = []
check = 'No enabled getter covers ACL or NAT on this platform yet; the audit list is empty until a lab-verified getter ships.'
good = 'ACL and NAT hold no inbound accept; nothing from outside reaches a LAN port.'

[[intent]]
id = 'INT-LOG-REMOTE'
explanation = 'Forward IOS XE logs to a syslog server; the device keeps an on-box log too.'
doc = 'profiles/iosxe/notes.md'
ledger = ''
audit = []
check = 'No enabled getter covers logging on this platform yet; the audit list is empty until a lab-verified getter ships.'
good = 'logs reach the configured syslog endpoint; the on-box log reflects the same events.'

[[intent]]
id = 'INT-NTP-SERVERS'
explanation = 'List the NTP servers IOS XE syncs against; the device clock must be right for every auth check.'
doc = 'profiles/iosxe/notes.md'
ledger = ''
audit = []
check = 'No enabled getter covers NTP on this platform yet; the audit list is empty until a lab-verified getter ships.'
good = 'At least one configured NTP server is reachable and the device reports its clock as synchronised.'
